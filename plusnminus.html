/* 依《數學遊戲網頁：通用設計規格書》v1.3：第 3 節學扶例外條款、3.4～3.6 學校版、3.8 列式練習、第 5 節共用介面 */
:root{
  --paper:#E3EDF2; --grid:#D0DEE6; --ink:#1B2836; --ink-soft:#4C5D6E; --card:#FFFFFF; --wash:#F3F7FA;
  --hl:#FFE066; --gold:#F2B400; --good:#1FA963; --bad:#E5484D; --blue:#3A9FEF;
  --pa:#FFB27A; --pb:#8FCBFF; --pq:#FFF3B0;
  --s-new:#FFFFFF; --s-weak:#FFB3B3; --s-learn:#FFE38A; --s-ok:#8FE0AE; --s-super:#FFC933;
  --f-display:'LXGW WenKai TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-num:'Fredoka','Noto Sans TC',sans-serif;
  --f-zy:'PNM Bpmf','LXGW WenKai TC','PingFang TC',serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{background:var(--paper)}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  height:100dvh; overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.wrap{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.25}
p{margin:0}
button{font-family:inherit;color:var(--ink)}
.zy{font-family:var(--f-zy);font-weight:400}
.zy .n{font-family:var(--f-num);font-weight:600;padding:0 .12em}

/* ---------- 標題列 ---------- */
.top{flex:none;display:flex;align-items:center;gap:8px 14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:26px;letter-spacing:.04em;cursor:default;white-space:nowrap}
.tagk{display:inline-block;background:var(--hl);border:3px solid var(--ink);border-radius:10px;padding:0 8px;box-shadow:3px 3px 0 var(--ink);font-family:var(--f-num);font-weight:600;font-size:20px;transform:rotate(-4deg);white-space:nowrap}
.badge{display:inline-block;font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--hl);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:700 16px var(--f-body);padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--hl)}
.btn.sm{font-size:14px;padding:4px 12px}
.btn.big{font-size:22px;padding:8px 26px}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:14px}
.dim{color:var(--ink-soft);font-size:14px;font-weight:700}
.warn{color:#B4232A}

main{flex:1;min-height:0;display:flex;flex-direction:column}
main>[data-screen]{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
[data-screen="home"],[data-screen="result"]{overflow:auto;padding:0 6px 6px 0}

/* ---------- 首頁 ---------- */
.home{display:grid;grid-template-columns:minmax(300px,1fr) minmax(330px,1.1fr);gap:16px;align-items:start}
.hello{font-weight:900;font-size:20px}
.lit{display:grid;gap:6px;margin:8px 0 4px}
.lit-txt{font-weight:900;font-size:18px}
.lit-txt b{font-family:var(--f-num);font-size:26px;margin:0 2px}
.bar{height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--s-ok),var(--s-super));border-right:3px solid var(--ink)}
.modes{display:grid;gap:10px;margin-top:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;width:100%;font:900 22px var(--f-body);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;background:var(--card)}
.mode:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.mode .ic{flex:none;width:54px;height:54px;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font:600 24px var(--f-num);background:#DCEEFF}
.mode small{display:block;font-size:15px;font-weight:700;color:var(--ink-soft);line-height:1.35}
.mine{margin-top:14px;border-top:2px dashed var(--grid);padding-top:10px;display:grid;gap:6px}
.mine h3{font-size:17px}
.pref-row{display:flex;align-items:center;gap:10px;font-weight:900}
.pref-row>span{min-width:3.5em}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:2px 2px 0 var(--ink)}
.seg button{font:700 16px var(--f-body);border:0;border-left:2px solid var(--ink);background:var(--card);padding:4px 14px;cursor:pointer;min-height:38px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--hl)}

/* ---------- 亮燈表：6 種題型 × 3 關 ---------- */
.ltbl h3{font-size:18px;margin-bottom:6px}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,64px) 30px;gap:4px;align-items:center}
.lgrid .hd{font-weight:900;font-size:13px;color:var(--ink-soft);text-align:center;white-space:nowrap}
.lgrid .tn{font-size:16px;line-height:1.3}
.lgrid .tn small{display:block;font:600 12px var(--f-body);color:var(--ink-soft)}
.cell{border:2px solid var(--ink);border-radius:8px;min-height:34px;background:var(--s-new);display:grid;place-items:center;font:700 12px var(--f-body)}
.cell.weak{background:var(--s-weak)} .cell.learn{background:var(--s-learn)} .cell.ok{background:var(--s-ok)}
.cell.lock{background:repeating-linear-gradient(45deg,#EEF2F5 0 6px,#E2E8ED 6px 12px);color:var(--ink-soft)}
.star{font-size:22px;text-align:center;filter:grayscale(1);opacity:.25}
.star.on{filter:none;opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;display:inline-block}

/* ---------- 練習畫面 ---------- */
.game{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:14px}
.g-col{min-height:0;display:flex;flex-direction:column;gap:10px}
.g-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chipm{font-weight:900;border:3px solid var(--ink);border-radius:999px;padding:0 14px;background:#DCEEFF;white-space:nowrap}
.chipm.quiz{background:#FFE2CC}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.done{background:var(--good)} .dots i.redo{background:var(--s-weak)} .dots i.now{background:var(--hl);transform:scale(1.25)}
.ptext{font-size:clamp(22px,3.2vmin,30px);line-height:1.75;letter-spacing:.06em;text-align:left}
.ptext .n{font-size:1.15em}
.ptext .claim{display:inline-block;margin-top:6px;border:3px solid var(--ink);border-radius:12px;padding:0 10px;background:#FFE2CC}
.diacard{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;justify-content:flex-start}
.say{font-size:clamp(17px,2.6vmin,22px);font-weight:900;line-height:1.5}
.say.zy{font-weight:400;font-size:clamp(19px,2.9vmin,25px);line-height:1.7}

/* 線段圖 */
.dia{position:relative;width:100%;margin:0 auto;padding:4px 0}
.dia .wtop,.dia .bots{display:flex;gap:0}
.dia .wtop{flex-direction:column;align-items:stretch}
.dia .lab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dia .lab .nm{font-family:var(--f-zy);font-size:clamp(16px,2.4vmin,21px);line-height:1.3;white-space:nowrap}
.dia .brace{height:14px;border:3px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;margin:2px 4px 0}
.dia .bots .brace{border-top:0;border-bottom:3px solid var(--ink);border-radius:0 0 14px 14px;margin:0 4px 2px;align-self:stretch}
.dia .segs{display:flex;height:44px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.dia .sg{min-width:0;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 3px}
.dia .sg.a{background:var(--pa)} .dia .sg.b{background:var(--pb);border-left:3px solid var(--ink)}
.dia .sg.q{box-shadow:inset 0 0 0 4px var(--gold);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 8px,transparent 8px 16px)}
.dia.mini .segs{height:30px}
.dia.mini .sg.wrong{background:#FFD0D0}
.dia .val{font:600 clamp(20px,3vmin,28px) var(--f-num);min-width:2.2em;height:1.5em;border:3px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center;padding:0 .2em}
.dia .val.q{background:var(--pq)}
.dia .val.lit{background:#D9F6E5;border-color:var(--good)}

/* 每種題型算對的寫法（老師已定）：照題目順序寫的式子、直接算出答案的式子。'?' 是 (　) */
const FORMS = {
  1:[['A','+','B','?'],['B','+','A','?']],   /* 合併沒有先後，交換順序也算對 */
  2:[['A','+','?','W'],['W','-','A','?']],
  3:[['A','+','B','?']],                     /* 有先後順序，交換順序算錯 */
  4:[['A','+','?','W'],['W','-','A','?']],
  5:[['W','-','A','?']],
  6:[['W','-','?','B'],['W','-','B','?']],
};

const Sound = {
  ac:null, muted:false,
  init(){ if (!this.ac){ try{ this.ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if (this.ac && this.ac.state==='suspended') this.ac.resume(); },
  tone(f,d,type,when,vol){
    const ac = this.ac; if (!ac || this.muted) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime+(when||0);
    o.type = type||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol||.14,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  },
  tap(){ this.tone(520,.05,'sine',0,.06); },
  drop(){ this.tone(700,.06,'triangle',0,.08); },
  good(){ this.tone(660,.12,'triangle'); this.tone(990,.2,'triangle',.08); },

};

function numbersFor(lv){
  const L = LEVELS[lv];
  for (let k=0;k<200;k++){
    const W = rnd(L.wMin, L.wMax), A = rnd(L.pMin, W - L.pMin), B = W - A;
    if (A===B || B < L.pMin) continue;
    if (lv===3 && (A%10===0 || B%10===0)) continue;
    return {A, B, W};
  }
  return {A:4, B:7, W:11};
}
function famFor(t, avoid){
  const list = FAMS[TYPE(t).g];
  const pool = list.filter(f => f.id!==avoid && f.id!==P.lastFam[t]);
  return pick(pool.length ? pool : list);
}
/* 一題：{t, lv, fam, A, B, W, ans, ask, text(HTML)} */
function makeProblem(t, lv, fam, nums){
  const f = fam || famFor(t), n = nums || numbersFor(lv), ask = ROLE_ASK(t);
  const tpl = f['t'+t];
  const text = H(tpl).replace(/\{(A|B|W)\}/g, (m,k) => `<span class="n">${n[k]}</span>`);
  return {t, lv, fam:f, ...n, ask, ans:n[ask], text, plain:tpl.replace(/\{(A|B|W)\}/g, (m,k) => n[k])};
}
const knownRoles = pr => ['A','B','W'].filter(r => r!==pr.ask);
const say = (k, pr) => H(SAY[k]).replace(/\{(nA|nB|nW)\}/g, (m,x) => H(pr.fam[x]));

/* 一局：對比題成對出（同一個情境、不同數字），成對的兩題不相鄰 */
function buildRound(){
  const n = (P.pref.n || ROUND_N);
  const score = t => { const s = stOf(t, curLv(t)); return allOk(t) ? 0 : s==='weak' ? 3 : s==='fresh' ? 2 : s==='learn' ? 2 : 1; };
  const pairs = shuffle(PAIRS.slice()).sort((x,y) => (score(y[0])+score(y[1])) - (score(x[0])+score(x[1])));
  const chosen = [];
  for (let i=0; chosen.length < n/2; i++) chosen.push(pairs[i % pairs.length]);
  const items = [];
  chosen.forEach(pr => {
    const fam = famFor(pr[0]);
    pr.forEach(t => items.push({t, lv:curLv(t), fam, redo:false}));
  });
  /* 排順序：同一對不相鄰、同一題型不連續 */
  for (let k=0;k<300;k++){
    shuffle(items);
    let okk = true;
    for (let i=1;i<items.length;i++){
      const a = items[i-1], b = items[i];
      if (a.t===b.t || TYPE(a.t).pair===b.t){ okk = false; break; }
    }
    if (okk) break;
  }
  return items;
}

/* 題目的線段圖：數字都放好，要問的地方是 (　) 或答案 */
function probBar(pr, o){

  const labels = {};
  ['A','B','W'].forEach(r => {

/* =====================================================================
   卡片拖曳（也可以點一下卡片、再點一下格子）
   ===================================================================== */
/* B = {slots:{id:{accept:[...], tok:null}}, toks:[{id, kind:'num'|'paren'|'op'|'ans', val, label}], drops:0} */
let BRD = null, selTok = null, onBoardChange = null;
function newBoard(slots, toks){ BRD = {slots, toks, drops:0}; selTok = null; return BRD; }
const tokById = id => BRD.toks.find(t => t.id===id);
const slotOfTok = id => Object.keys(BRD.slots).find(s => BRD.slots[s].tok===id);
const tokHTML = t => `<button type="button" class="tok ${t.kind} ${selTok===t.id?'sel':''}" data-tok="${t.id}">${H(t.label)}</button>`;
function slotHTML(id, extra){
  const s = BRD.slots[id]; const t = s.tok ? tokById(s.tok) : null;
  return `<span class="slot ${s.accept.includes('op')?'op':''} ${t?'full':''} ${s.cls||''} ${selTok&&!t?'armed':''} ${extra||''}" data-slot="${id}">${t ? tokHTML(t) : ''}</span>`;
}
const trayHTML = () => `<div class="tray" id="tray">${BRD.toks.filter(t => !slotOfTok(t.id)).map(tokHTML).join('') || '<span class="dim">卡片都放好了</span>'}</div>`;
function place(tokId, slotId){
  const s = BRD.slots[slotId], t = tokById(tokId);
  if (!s || !t || s.locked) return false;
  if (!s.accept.includes(t.kind)){ Sound.soft(); toast(t.kind==='op' ? '＋、−要放在中間的格子' : '這個格子要放數字或 (　)', 1400); return false; }
  const from = slotOfTok(tokId);
  if (from) BRD.slots[from].tok = null;
  if (s.tok && from) BRD.slots[from].tok = s.tok;       /* 兩個格子互換 */
  s.tok = tokId; s.cls = '';
  BRD.drops++; selTok = null; Sound.drop();
  if (onBoardChange) onBoardChange();
  return true;
}
function unplace(slotId){
  const s = BRD.slots[slotId]; if (!s || !s.tok || s.locked) return;
  s.tok = null; s.cls = ''; Sound.tap(); if (onBoardChange) onBoardChange();
}
let drag = null;
document.addEventListener('pointerdown', e => {
  if (!BRD) return;
  const tk = e.target.closest('.tok[data-tok]');
  const sl = e.target.closest('[data-slot]');
  if (tk && !(sl && BRD.slots[sl.dataset.slot].locked)){
    drag = {id:tk.dataset.tok, x:e.clientX, y:e.clientY, el:tk, ghost:null, slot:sl ? sl.dataset.slot : null};
    e.preventDefault(); return;
  }
  if (sl){
    if (selTok){ place(selTok, sl.dataset.slot); return; }
  }
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.ghost && Math.hypot(dx,dy) > 8){
    const g = drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
    const r = drag.el.getBoundingClientRect(); g.style.width = r.width+'px'; g.style.height = r.height+'px';
    document.body.appendChild(g); drag.ghost = g; drag.el.style.opacity = '.3';
  }
  if (drag.ghost){
    drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
    document.querySelectorAll('.slot.over').forEach(s => s.classList.remove('over'));
    const el = document.elementFromPoint(e.clientX, e.clientY); const sl = el && el.closest('[data-slot]');
    if (sl) sl.classList.add('over');
  }
}, {passive:true});
function endDrag(e){
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost){
    d.ghost.remove(); d.el.style.opacity = '';
    const el = document.elementFromPoint(e.clientX, e.clientY); const sl = el && el.closest('[data-slot]');
    document.querySelectorAll('.slot.over').forEach(s => s.classList.remove('over'));
    if (sl) place(d.id, sl.dataset.slot);
    else if (d.slot && el && el.closest('#tray')) unplace(d.slot);
    else if (onBoardChange) onBoardChange();
    return;
  }
  /* 點一下：格子裡的卡片 → 拿回來；托盤裡的卡片 → 選起來 */
  if (d.slot){ unplace(d.slot); return; }
  selTok = selTok===d.id ? null : d.id; Sound.tap();
  if (onBoardChange) onBoardChange();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', e => { if (drag){ if (drag.ghost) drag.ghost.remove(); drag.el.style.opacity = ''; drag = null; } });

/* 算式卡片：兩個已知的數、(　)、＋、− */
function eqBoard(pr){
  const toks = shuffle(knownRoles(pr).map(r => ({id:'n'+r, kind:'num', val:pr[r], role:r, label:String(pr[r])}))
    .concat([{id:'q', kind:'paren', role:'?', label:PAREN}]));
  toks.push({id:'p', kind:'op', val:'+', label:'+'}, {id:'m', kind:'op', val:'-', label:'−'});
  return newBoard({e1:{accept:['num','paren'], tok:null}, e2:{accept:['op'], tok:null}, e3:{accept:['num','paren'], tok:null}, e4:{accept:['num','paren'], tok:null}}, toks);
}
const eqRowHTML = (ansSlotHTML) => `<div class="eqrow">${slotHTML('e1')}${slotHTML('e2')}${slotHTML('e3')}<span class="fx">＝</span>${slotHTML('e4')}</div>`;
/* 排好的算式 → 角色：['A','+','?','W'] */
function eqSym(){
  return ['e1','e2','e3','e4'].map(s => { const t = tokById(BRD.slots[s].tok); return t.kind==='op' ? t.val : t.role; });
}
function eqText(sym, pr, ansVal){ const v = x => x==='?' ? (ansVal!=null ? `(${ansVal})` : PAREN) : pr[x]; return `${v(sym[0])} ${sym[1]==='+'?'+':'−'} ${v(sym[2])} ＝ ${v(sym[3])}`; }
const sameSym = (a,b) => a.every((x,i) => x===b[i]);
const eqOk = (t, sym) => FORMS[t].some(f => sameSym(f, sym));

/* 孩子的算式代表的線段圖（算不出來就不畫） */
function studentBar(sym, pr){
  const v = x => x==='?' ? null : pr[x];
  let [x, op, y, z] = sym.map(v); let qi = sym.indexOf('?');
  if (op==='+'){ /* x + y = z：部分 x、y，全部 z */
    if (qi===0) x = z - y; else if (qi===2) y = z - x; else z = x + y;
    if (!(x>0 && y>0 && z>0)) return null;
    return {A:x, B:y, W:z, q:qi===0?'A':qi===2?'B':'W'};
  } else {       /* x − y = z：全部 x，拿走 y，剩下 z */
    if (qi===0) x = y + z; else if (qi===2) y = x - z; else z = x - y;
    if (!(x>0 && y>0 && z>0)) return null;
    return {A:y, B:z, W:x, q:qi===0?'W':qi===2?'A':'B'};
  }
}
/* 答錯時的說明：依孩子算式說的故事，和題目比 */
function eqWhy(sym, pr){
  const t = pr.t, f = pr.fam, u = f.u, op = sym[1], A = pr.A, B = pr.B, W = pr.W;
  const has = r => sym.includes(r);
  if (t===1 || t===3){
    if (op==='-') return `題目問的是「${f.nW}」，要把兩個部分合起來。`;
    if (t===3 && sameSym(sym, ['B','+','A','?'])) return `題目先有 ${A} ${u}，後來才${f.verb} ${B} ${u}，算式要照題目的順序寫。`;
    return `(　)要放在題目問的地方：「${f.nW}」還不知道。`;
  }
  if (t===2 || t===4){
    if (op==='+' && sym[3]==='?') return `${W} 是「${f.nW}」，已經包含 ${A} 了，不用再加起來。`;
    if (sameSym(sym, ['?','+','A','W'])) return `算式從題目先告訴你的數開始寫：先寫 ${A}。`;
    if (op==='-' && sym[0]==='A') return `${A} 比 ${W} 小，不能從 ${A} 裡拿走 ${W}。`;
    if (sameSym(sym, ['W','-','?','A'])) return `這個算式是說「${W} 拿走一些，剩下 ${A}」，和題目說的不一樣。`;
  }
  if (t===5){
    if (op==='+') return `${A} ${u}是「${f.nA}」，要從 ${W} ${u}裡拿走，不是加起來。`;
    if (sym[0]==='A') return `${A} 比 ${W} 小，不能從 ${A} 裡拿走 ${W}。`;
    if (sameSym(sym, ['W','-','?','A'])) return `這個算式是說「剩下 ${A} ${u}」，可是 ${A} ${u}是「${f.nA}」。`;
  }
  if (t===6){
    if (op==='+' && sym[3]==='?') return `${W} 是「${f.nW}」，${B} 是「${f.nB}」，不用加起來。`;
    if (sameSym(sym, ['?','+','B','W'])) return `算式從題目先告訴你的數開始寫：先寫 ${W}。`;
    if (op==='-' && sym[0]==='B') return `${B} 比 ${W} 小，不能從 ${B} 裡拿走 ${W}。`;
  }
  return '這個算式說的故事，和題目不一樣。看看線段圖，(　)在哪一段？';
}
/* 驗算用的另一個算式（加減互逆）；'R' 是要放答案的位置 */
function checkSym(t, listed){
  if (t===1 || t===3) return ['R','-','B','A'];
  if (t===2 || t===4) return listed[1]==='-' ? ['A','+','R','W'] : ['W','-','A','R'];
  if (t===5) return ['A','+','R','W'];
  return ['R','+','B','W'];
}

/* =====================================================================
   一局（練習／小測）
   ===================================================================== */
function startRound(mode){
  let q;
  if (mode==='quiz'){
    q = shuffle(TYPES.map(t => ({t:t.id, lv:2, fam:famFor(t.id), redo:false})));
  } else q = buildRound();
  G = {mode, q, i:0, log:[], redone:0, litBefore:litCount(), roundsBefore:P.rounds, snap:JSON.parse(JSON.stringify(P.cells))};
  show('game');
  $('#gMode').textContent = mode==='quiz' ? '小測（大人在旁邊）' : '列式練習';
  $('#gMode').className = 'chipm' + (mode==='quiz' ? ' quiz' : '');
  nextItem();
}
function renderDots(){ $('#gDots').innerHTML = G.q.map((e,i) => `<i class="${i<G.i?'done':i===G.i?'now':e.redo?'redo':''}"></i>`).join(''); }
function nextItem(){
  if (!G) return;
  if (G.i >= G.q.length) return endRound();
  const e = G.q[G.i], pr = makeProblem(e.t, e.lv, e.fam);
  P.lastFam[e.t] = pr.fam.id;
  G.pr = pr; G.e = e;
  G.steps = G.mode==='quiz' ? ['eq','calc'] : (LEVELS[pr.lv].dots ? ['split','label','eq','calc','check'] : ['eq','calc','check']);
  G.si = 0; G.tries = {}; G.first = {}; G.voided = false; G.scored = false; G.t0 = performance.now(); G.firstT = null;
  G.hint = 0; G.split = null; G.input = ''; G.listed = null; G.msg = ''; G.msgCls = ''; G.drops = 0; G.calcOk = null;
  $('#gText').innerHTML = pr.text;
  renderDots(); enterStep();
}
const step = () => G.steps[G.si];
function enterStep(){
  const s = step(), pr = G.pr;
  G.msg = ''; G.msgCls = '';
  if (s==='label'){
    const toks = shuffle(knownRoles(pr).map(r => ({id:'n'+r, kind:'num', val:pr[r], role:r, label:String(pr[r])})).concat([{id:'q', kind:'paren', role:'?', label:PAREN}]));
    newBoard({lA:{accept:['num','paren'], tok:null}, lB:{accept:['num','paren'], tok:null}, lW:{accept:['num','paren'], tok:null}}, toks);
  } else if (s==='eq'){
    eqBoard(pr); G.hint = 0;
  } else if (s==='calc'){
    G.input = ''; BRD = null;
  } else if (s==='check'){
    G.csym = checkSym(pr.t, G.listed);
    newBoard({c:{accept:['ans'], tok:null}}, [{id:'r', kind:'ans', val:pr.ans, label:String(pr.ans)}]);
  } else BRD = null;
  onBoardChange = s==='check' ? () => { if (BRD.slots.c.tok) checkDropped(); else renderGame(); } : renderGame;
  renderGame();
}
/* ---------- 畫面 ---------- */
function renderGame(){
  if (!G) return;
  const s = step(), pr = G.pr, dia = $('#gDia'), right = $('#gRight');
  const msg = `<div class="msg ${G.msgCls}" id="gMsg">${G.msg}</div>`;
  let d = '', r = '';
  if (s==='split'){
    const sp = G.split, n = pr.W;
    let dots = '';
    for (let i=0;i<n;i++){
      const cls = sp==null ? '' : (i < sp ? 'a' : 'b');
      dots += `<i class="dot ${cls}" data-i="${i}"></i>`;
      if (sp!=null && i===sp-1 && i<n-1) dots += '<span class="div"></span>';
    }

    d = `<p class="say zy">${say('split', pr)}</p>

      <div class="dotrow" id="dotrow" style="--dd:${dd}px">${dots}</div>`;
    r = `<div class="card eqcard">${msg}<div class="actions"><button class="btn primary big" type="button" id="gOk" ${sp==null?'disabled':''}>確定</button></div></div>`;
  }
  else if (s==='label'){
    const labels = {A:slotHTML('lA'), B:slotHTML('lB'), W:slotHTML('lW')};
    d = `<p class="say zy">${say('label', pr)}</p>` + barHTML({A:pr.A, B:pr.B, W:pr.W, dots:true, labels, names:{A:pr.fam.nA, B:pr.fam.nB, W:pr.fam.nW}});
    const full = ['lA','lB','lW'].every(k => BRD.slots[k].tok);
    r = `<div class="card eqcard">${trayHTML()}${msg}<div class="actions"><button class="btn primary big" type="button" id="gOk" ${full?'':'disabled'}>確定</button></div></div>`;
  }
  else if (s==='eq'){
    const showDia = LEVELS[pr.lv].dots || G.hint >= 1;
    if (G.mode==='quiz') d = `<p class="say zy">${H(SAY.quiz)}</p>`;
    else if (showDia){
      const sb = G.hint>=1 && G.lastSym ? studentBar(G.lastSym, pr) : null;
      const mx = Math.max(pr.W, sb ? sb.W : 0);
      d = `<p class="mini-cap zy">${H(SAY.title)}</p>` + probBar(pr, {q:G.hint>=2, scale:pr.W/mx});
      if (sb && G.hint===1){
        const lab = {}; ['A','B','W'].forEach(k => lab[k] = valHTML(sb.q===k ? PAREN : sb[k], sb.q===k ? 'q' : ''));
        d += `<p class="mini-cap zy">${H(SAY.you)}</p>` + barHTML({A:sb.A, B:sb.B, W:sb.W, dots:false, labels:lab, names:{}, scale:sb.W/mx, mini:true});
      }
    } else d = `<p class="say zy">${H(SAY.eq)}</p><p class="dim">想一想：題目問的是哪一個數？</p>`;
    const full = ['e1','e2','e3','e4'].every(k => BRD.slots[k].tok);
    const hint = G.hint>=3 ? `<div class="hintbox"><b>照著排排看：</b><div class="eqrow" style="font-size:28px">${eqText(FORMS[pr.t][0], pr)}</div></div>` : '';
    r = `<div class="card eqcard"><p class="say zy">${H(SAY.eq)}</p>${eqRowHTML()}</div>
      ${trayHTML()}<div class="card eqcard">${msg}${hint}<div class="actions"><button class="btn primary big" type="button" id="gOk" ${full?'':'disabled'}>確定</button></div></div>`;
  }
  else if (s==='calc'){
    const v = G.input ? H(G.input) : '<span class="cur"></span>';
    const sym = G.listed, box = `<span class="ansbox">${v}</span>`;
    const tv = x => x==='?' ? box : `<span>${pr[x]}</span>`;
    if (G.mode==='quiz') d = `<p class="say zy">${H(SAY.calc)}</p>`;
    else if (LEVELS[pr.lv].dots || G.hint >= 1 || G.calcHint) d = `<p class="say zy">${H(SAY.calc)}</p>` + probBar(pr, {});
    else d = `<p class="say zy">${H(SAY.calc)}</p>`;
    const ch = G.calcHint ? `<div class="hintbox">${G.calcHint}</div>` : '';
    r = `<div class="card eqcard"><div class="eqrow">${tv(sym[0])}<span class="fx">${sym[1]==='+'?'+':'−'}</span>${tv(sym[2])}<span class="fx">＝</span>${tv(sym[3])}</div>${msg}${ch}</div>
      <div class="pad" id="pad">${[7,8,9,4,5,6,1,2,3].map(n => `<button type="button" data-n="${n}">${n}</button>`).join('')}
      <button type="button" class="del" data-k="del">⌫ 清除</button><button type="button" data-n="0">0</button><button type="button" class="go" data-k="go" ${G.input?'':'disabled'}>確定</button></div>`;
  }
  else if (s==='check'){
    const cs = G.csym, done = !!BRD.slots.c.tok;
    const tv = x => x==='R' ? slotHTML('c', done ? 'ok' : '') : `<span>${pr[x]}</span>`;
    d = `<p class="say zy">${H(SAY.check)}</p>` + probBar(pr, {ans:done ? pr.ans : null, lit:done});
    r = `<div class="card eqcard"><div class="mini-cap">你的算式：<span style="font:600 22px var(--f-num)">${eqText(G.listed, pr, pr.ans)}</span></div>
      <p class="say zy">${H(SAY.check)}</p>
      <div class="eqrow">${tv(cs[0])}<span class="fx">${cs[1]==='+'?'+':'−'}</span>${tv(cs[2])}<span class="fx">＝</span>${tv(cs[3])}</div></div>
      ${done ? '' : trayHTML()}<div class="card eqcard">${msg}</div>`;
  }
  dia.innerHTML = d; right.innerHTML = r;
}

/* ---------- 操作 ---------- */
$('#gDia').addEventListener('pointerdown', e => {
  if (!G || step()!=='split') return;
  const dot = e.target.closest('.dot[data-i]'); if (!dot) return;
  setSplit(+dot.dataset.i + 1);
  const move = ev => { const el = document.elementFromPoint(ev.clientX, ev.clientY); const dd = el && el.closest('#dotrow .dot[data-i]'); if (dd) setSplit(+dd.dataset.i + 1); };
  const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
});
function setSplit(n){
  if (n >= G.pr.W) n = G.pr.W - 1;
  if (n < 1) n = 1;
  if (G.split!==n){ G.split = n; Sound.tap(); renderGame(); }
}
$('#gRight').addEventListener('click', e => {
  if (!G) return;
  if (e.target.closest('#gOk')) return submit();
  const b = e.target.closest('#pad button'); if (b) return press(b.dataset.n!=null ? b.dataset.n : b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (!$('#tp').hidden) return;
  if (screen==='game' && G && step()==='calc'){
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key==='Backspace'){ e.preventDefault(); press('del'); }
    else if (e.key==='Enter') press('go');
  } else if (screen==='game' && D && (D.st==='calc' || D.st==='fix')){
    if (/^[0-9]$/.test(e.key)) dPress(e.key);
    else if (e.key==='Backspace'){ e.preventDefault(); dPress('del'); }
    else if (e.key==='Enter') dPress('go');
  }
});
function press(k){
  if (G.lock) return;
  Sound.tap();
  if (k==='del') G.input = '';
  else if (k==='go') return submit();
  else if (G.input.length < 3) G.input = (G.input==='0' ? '' : G.input) + k;
  renderGame();
}
function setMsg(t, cls){ G.msg = t; G.msgCls = cls||''; }
function markFirst(key, ok){
  if (!(key in G.first)) G.first[key] = ok;
  G.tries[key] = (G.tries[key]||0) + 1;
}
/* 第一次「算分的步驟」送出的時間（第1關是放數字，其他關是列式） */
function noteTime(){ if (G.firstT==null) G.firstT = (performance.now() - G.t0) / 1000; }

function submit(){
  if (G.lock) return;
  const s = step(), pr = G.pr;
  if (s==='split'){
    const ok = G.split === pr.A;
    markFirst('split', ok);
    if (ok){ Sound.good(); return nextStep(); }
    Sound.soft();
    if (G.tries.split >= 2){ G.split = pr.A; setMsg(`分隔線幫你放好了：左邊 ${pr.A} 個是「${pr.fam.nA}」。`, 'bad'); renderGame(); G.lock = true; setTimeout(() => { G.lock = false; nextStep(); }, 1600); return; }
    setMsg(pr.ask==='A' ? `右邊是「${pr.fam.nB}」，有 ${pr.B} 個。從右邊數一數。` : `左邊是「${pr.fam.nA}」，題目說有幾個？數一數。`, 'bad');
    return renderGame();
  }
  if (s==='label'){
    noteTime();
    const want = {lA:pr.ask==='A'?'?':'A', lB:pr.ask==='B'?'?':'B', lW:pr.ask==='W'?'?':'W'};
    const bad = Object.keys(want).filter(k => tokById(BRD.slots[k].tok).role !== want[k]);
    markFirst('label', !bad.length);
    if (!bad.length){ Sound.good(); return nextStep(); }
    Sound.soft();
    if (G.tries.label >= 3){       /* 第 3 次幫忙放好 */
      Object.keys(want).forEach(k => { BRD.slots[k].tok = BRD.toks.find(t => t.role===want[k]).id; BRD.slots[k].locked = true; });
      setMsg('幫你放好了，看一看每個數字在哪裡。', 'bad'); renderGame(); G.lock = true;
      setTimeout(() => { G.lock = false; nextStep(); }, 1800); return;
    }
    bad.forEach(k => { BRD.slots[k].tok = null; BRD.slots[k].cls = 'bad'; });
    setMsg(G.tries.label===1 ? '有的卡片放錯地方了。再讀一次題目：每個數字是誰的？' : `(　)要放在題目問的地方：題目問的是「${pr.fam['n'+pr.ask]}」。`, 'bad');
    return renderGame();
  }
  if (s==='eq'){
    noteTime();
    const sym = eqSym(), pc = sym.filter(x => x==='?').length;
    if (pc!==1){ Sound.soft(); setMsg('算式裡要有一個 (　)，代表題目問的數。', 'bad'); return renderGame(); }
    const ok = eqOk(pr.t, sym);
    markFirst('eq', ok);
    G.drops += BRD.drops;
    if (!G.firstSym) G.firstSym = sym.slice();
    if (ok){
      G.listed = sym; Sound.good();
      setMsg(G.tries.eq===1 ? '算式排對了！' : '對了！', 'good');
      scoreItem();
      ['e1','e2','e3','e4'].forEach(k => { BRD.slots[k].locked = true; BRD.slots[k].cls = 'ok'; });
      renderGame(); G.lock = true;
      setTimeout(() => { G.lock = false; nextStep(); }, 900);
      return;
    }
    Sound.soft();
    if (G.mode==='quiz'){                     /* 小測：不給提示，記下來就換下一題 */
      G.listed = null; scoreItem();
      setMsg('好，下一題。'); ['e1','e2','e3','e4'].forEach(k => BRD.slots[k].locked = true); renderGame(); G.lock = true;
      setTimeout(() => { G.lock = false; finishItem(); }, 1000); return;
    }
    G.lastSym = sym; G.hint = Math.min(3, G.hint + 1); cell(pr.t, pr.lv).hints++;
    scoreItem();
    setMsg(eqWhy(sym, pr), 'bad');
    ['e1','e2','e3','e4'].forEach(k => BRD.slots[k].cls = 'bad');
    renderGame();
    setTimeout(() => { if (G && step()==='eq' && BRD){ ['e1','e2','e3','e4'].forEach(k => { BRD.slots[k].cls = ''; }); } }, 600);
    return;
  }
  if (s==='calc'){
    if (!G.input) return;
    const v = +G.input, ok = v === pr.ans;
    markFirst('calc', ok);
    if (ok){
      G.calcOk = G.tries.calc===1; Sound.good(); setMsg('答對了！', 'good');
      if (!G.calcOk){ cell(pr.t, pr.lv).calcWrong++; }
      renderGame(); G.lock = true;
      setTimeout(() => { G.lock = false; G.mode==='quiz' ? finishItem() : nextStep(); }, 800); return;
    }
    Sound.soft(); G.input = '';
    if (G.mode==='quiz'){ G.calcOk = false; setMsg('好，下一題。'); renderGame(); G.lock = true; setTimeout(() => { G.lock = false; finishItem(); }, 900); return; }
    if (G.tries.calc===1){
      G.calcHint = pr.lv===1 ? '數一數線段圖上的點點。' : pr.lv===2 ? '看著線段圖想一想，也可以用手指頭或畫圈圈算。' : '可以在紙上寫直式算一算。';
      setMsg('算式是對的，再算一次。', 'bad');
    } else { G.calcHint = `答案是 <b style="font:600 24px var(--f-num)">${pr.ans}</b>，輸入看看。`; setMsg('沒關係，照著輸入。', 'bad'); }
    return renderGame();
  }
}
function nextStep(){
  G.si++; G.calcHint = null;
  if (G.si >= G.steps.length) return finishItem();
  enterStep();
}
/* 驗算：把答案放進另一個算式 */
function checkDropped(){
  if (!G || step()!=='check' || !BRD.slots.c.tok) return;
  BRD.slots.c.locked = true;
  const pr = G.pr, cs = G.csym, v = x => x==='R' ? pr.ans : pr[x];
  setMsg(`✔ ${v(cs[0])} ${cs[1]==='+'?'+':'−'} ${v(cs[2])} ＝ ${v(cs[3])}，算式成立，答案沒問題！`, 'good');
  Sound.star(); renderGame(); G.lock = true;
  setTimeout(() => { G.lock = false; nextStep(); }, 1700);
}

/* ---------- 算分：只採計第一次、沒看提示的作答 ---------- */
function scoreItem(){
  if (G.scored) return; G.scored = true;
  const pr = G.pr, e = G.e;
  if (G.voided && G.mode!=='quiz'){ G.itemVoid = true; return; }           /* 中途離開：這一次不算 */
  const okLabel = G.first.label !== false, okEq = G.first.eq === true;
  const ok = okLabel && okEq;
  const fast = G.firstT!=null && G.firstT < FAST_SEC;
  const sym = G.firstSym || (BRD && BRD.slots.e1 ? eqSym() : null);
  const rec = {t:Date.now(), type:pr.t, lv:pr.lv, fam:pr.fam.id, text:pr.plain, eq:sym ? eqText(sym, pr) : '', ok, label:G.first.label, redo:e.redo, fast, mode:G.mode};
  G.cur = rec;
  if (G.mode==='quiz'){ G.log.push(rec); return; }
  const c = cell(pr.t, pr.lv);
  c.seen++; if (!ok) c.wrong++; if (fast) c.fast++;
  if (e.redo){                                          /* 補出的題目：同一局不升級，最高到練習中 */
    if (!ok) c.s = 'weak';
    else if (c.s==='weak' || c.s==='fresh') c.s = 'learn';
  } else {
    c.hist.push({ok, fam:pr.fam.id}); if (c.hist.length > 6) c.hist.shift();
    c.s = evalCell(pr.t, pr.lv);
  }
  P.att.unshift(rec); if (P.att.length > 60) P.att.length = 60;
  G.log.push(rec);
  /* 大人來問：當下就看得出來的 */
  if (fast && !ok) addFlag(rec, 2, `題目出現 ${G.firstT.toFixed(1)} 秒就送出又排錯，可能沒有讀題`);
  if (pr.lv===1 && G.first.label===false && G.first.eq===true && !e.redo) addFlag(rec, 2, '線段圖的數字放錯，算式卻排對');
  if (ok && BRD && BRD.drops > 10) addFlag(rec, 1, `卡片換了 ${BRD.drops} 次才排好，可能是試出來的`);
  if (!ok && !e.redo && G.redone < REDO_MAX){            /* 答錯的題型，隔 2 題換個情境再出一次 */
    G.redone++;
    G.q.splice(Math.min(G.i + REINSERT_GAP, G.q.length), 0, {t:pr.t, lv:pr.lv, fam:famFor(pr.t, pr.fam.id), redo:true});
  }
  save();
}
function evalCell(t, lv){
  const c = cell(t, lv), last = c.hist[c.hist.length-1];
  if (!last || !last.ok) return 'weak';
  const recent = c.hist.slice(-MASTER_N);
  const fams = new Set(recent.map(h => h.fam));
  const pc = P.cells[ckey(TYPE(t).pair, lv)], pl = pc && pc.hist[pc.hist.length-1];
  if (recent.length===MASTER_N && recent.every(h => h.ok) && fams.size===MASTER_N && pl && pl.ok) return 'ok';
  return 'learn';
}
function addFlag(rec, pri, why){
  P.flags.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,6), t:rec.t, type:rec.type, lv:rec.lv, text:rec.text, eq:rec.eq, ok:rec.ok, pri, why});
  if (P.flags.length > 40) P.flags.length = 40;
}
function finishItem(){
  if (!G.scored) scoreItem();
  if (G.itemVoid && G.mode!=='quiz'){       /* 離開畫面的題目：隔 2 題再出 */
    G.q.splice(Math.min(G.i + REINSERT_GAP, G.q.length), 0, {t:G.pr.t, lv:G.pr.lv, fam:famFor(G.pr.t, G.pr.fam.id), redo:G.e.redo});
  }
  if (G.cur) G.cur.calcOk = G.calcOk;
  G.itemVoid = false; G.cur = null; G.firstSym = null; G.lastSym = null;
  G.i++; nextItem();
}

/* ---------- 結算 ---------- */
function endRound(){
  const g = G; G = null; BRD = null;
  if (g.mode==='quiz'){
    P.quiz.unshift({t:Date.now(), items:g.log.map(l => ({type:l.type, text:l.text, eq:l.eq, ok:l.ok, calcOk:l.calcOk}))});
    if (P.quiz.length > 10) P.quiz.length = 10;
    addLog('完成一次小測'); save();
    show('result');
    $('#result').innerHTML = `<div class="r-top"><h2>小測做完了</h2></div><p class="hello">謝謝你！請把平板拿給大人。</p>
      <div class="row"><button class="btn primary" type="button" id="rHome">回首頁</button></div>`;
    $('#rHome').onclick = () => show('home');
    return;
  }
  /* 對比題：同一對一題對、一題錯 → 大人來問 */
  const firsts = g.log.filter(l => !l.redo);
  PAIRS.forEach(([a,b]) => {
    const la = firsts.filter(l => l.type===a), lb = firsts.filter(l => l.type===b);
    if (!la.length || !lb.length) return;
    const oa = la.every(l => l.ok), ob = lb.every(l => l.ok);
    if (oa===ob) return;
    const wrong = (oa ? lb : la).find(l => !l.ok);
    const kwOk = TYPE(oa ? a : b).kw==='一致';
    const why = a===5 ? '「剩下幾個」對、「拿走幾個」錯：(　)的位置可能弄錯' :
      kwOk ? '關鍵字和算法一致的題目對，相反的題目錯：可能只看關鍵字' : '對比題一題對、一題錯';
    addFlag(wrong, kwOk ? 3 : 2, why);
  });
  P.rounds++; save(); Sound.win();
  const gain = litCount() - g.litBefore;
  let trend;
  if (g.roundsBefore===0) trend = {cls:'best', text:'🚀 第一次練習！'};
  else if (gain > 0) trend = {cls:'up', text:`👍 這一局點亮了 ${gain} 格！`};
  else trend = {cls:'', text:'💪 繼續加油！'};
  const firstOk = g.log.filter(l => l.ok).length;
  show('result');
  $('#result').innerHTML = `
    <div class="r-top"><h2>🎉 練習完成！</h2><span class="trend ${trend.cls}">${trend.text}</span></div>
    <div class="lit" style="max-width:560px"><div class="lit-txt">已經點亮 <b>${litCount()}</b> / ${litTotal()} 格</div><div class="bar"><i style="width:${Math.round(litCount()/litTotal()*100)}%"></i></div></div>
    <div class="r-stats"><div>一次就排對<b>${firstOk}</b> 題</div><div>練了<b>${g.log.length}</b> 題</div></div>
    <div class="r-list">${g.log.map(l => `<div class="r-item"><span class="mk">${l.ok?'⭕':'🔁'}</span><span class="zy">${H(TYPE(l.type).kid)}</span><span class="eq">${H(l.eq)}</span></div>`).join('')}</div>
    <div style="max-width:640px">${lightsHTML()}</div>
    <div class="row"><button class="btn primary" type="button" id="rAgain">再練一局</button><button class="btn" type="button" id="rHome">回首頁</button></div>`;
  $('#rAgain').onclick = () => startRound('practice');
  $('#rHome').onclick = () => show('home');
}

/* =====================================================================
   驗算小偵探：小明的答案對不對？
   ===================================================================== */
function detSym(t){
  if (t===1 || t===3) return {sym:['X','-','B','R'], cmp:'A'};
  if (t===6) return {sym:['X','+','B','R'], cmp:'W'};
  return {sym:['A','+','X','R'], cmp:'W'};
}
function claimFor(pr, right){
  if (right) return pr.ans;
  const k = knownRoles(pr), a = pr[k[0]], b = pr[k[1]];
  const opts = [];
  if (pr.ask==='W') opts.push(Math.abs(a-b), pr.ans+1, pr.ans-1, pr.ans+2);
  else opts.push(a+b, pr.ans+1, pr.ans-1, pr.ans+2, pr.ans-2);
  const minX = (pr.t===1 || pr.t===3) ? pr.B + 1 : 1;
  const good = opts.filter(x => x!==pr.ans && x>=minX && x<100);
  return pick(good.length ? good : [pr.ans+1]);
}
function startDetect(){
  const rights = shuffle([true,true,false,false,Math.random()<.5]).slice(0, DETECT_N);
  const types = shuffle([1,2,3,4,5,6]).slice(0, DETECT_N);
  D = {q:types.map((t,i) => ({t, right:rights[i]})), i:0, ok:0};
  G = null; BRD = null;
  show('game'); $('#gMode').textContent = '🔍 驗算小偵探'; $('#gMode').className = 'chipm';
  dNext();
}
function dNext(){
  if (D.i >= D.q.length) return dEnd();
  const e = D.q[D.i], lv = Math.min(2, curLv(e.t));
  const pr = makeProblem(e.t, lv);
  D.pr = pr; D.claim = claimFor(pr, e.right); D.right = e.right;
  const ds = detSym(e.t); D.sym = ds.sym; D.cmp = ds.cmp;
  D.st = 'place'; D.input = ''; D.tries = 0; D.msg = ''; D.msgCls = ''; D.R = null; D.judged = null;
  $('#gDots').innerHTML = D.q.map((x,i) => `<i class="${i<D.i?'done':i===D.i?'now':''}"></i>`).join('');
  $('#gText').innerHTML = pr.text + `<br><span class="claim">小明的答案：<span class="n">${D.claim}</span> ${H(pr.fam.u)}</span>`;
  newBoard({x:{accept:['ans'], tok:null}}, [{id:'x', kind:'ans', val:D.claim, label:String(D.claim)}]);
  onBoardChange = () => { if (D && D.st==='place' && BRD.slots.x.tok){ BRD.slots.x.locked = true; D.st = 'calc'; } dRender(); };
  dRender();
}
function dRender(){
  const pr = D.pr, s = D.sym;
  const box = D.st==='calc' ? `<span class="ansbox">${D.input ? H(D.input) : '<span class="cur"></span>'}</span>` : D.R!=null ? `<span class="val">${D.R}</span>` : '<span class="dim">?</span>';
  const tv = x => x==='X' ? slotHTML('x') : x==='R' ? box : `<span>${pr[x]}</span>`;
  const lab = {}; ['A','B','W'].forEach(r => lab[r] = r===pr.ask ? valHTML(PAREN,'q') : valHTML(pr[r]));
  $('#gDia').innerHTML = `<p class="say zy">${H(SAY.det)}</p>` + barHTML({A:pr.A, B:pr.B, W:pr.W, dots:false, labels:lab, names:{A:pr.fam.nA, B:pr.fam.nB, W:pr.fam.nW}});
  let r = `<div class="card eqcard"><div class="mini-cap">用驗算檢查小明的答案</div>
    <div class="eqrow">${tv(s[0])}<span class="fx">${s[1]==='+'?'+':'−'}</span>${tv(s[2])}<span class="fx">＝</span>${tv(s[3])}</div>
    ${D.R!=null ? `<p class="say">算出來是 <b style="font:600 26px var(--f-num)">${D.R}</b>，題目說「${H(pr.fam['n'+D.cmp])}」是 <b style="font:600 26px var(--f-num)">${pr[D.cmp]}</b>。</p>` : ''}
    <div class="msg ${D.msgCls}">${D.msg}</div></div>`;
  if (D.st==='place') r += trayHTML();
  if (D.st==='calc' || D.st==='fix'){
    r += `<div class="pad" id="dpad">${[7,8,9,4,5,6,1,2,3].map(n => `<button type="button" data-n="${n}">${n}</button>`).join('')}
      <button type="button" class="del" data-k="del">⌫ 清除</button><button type="button" data-n="0">0</button><button type="button" class="go" data-k="go" ${D.input?'':'disabled'}>確定</button></div>`;
    if (D.st==='fix') r = r.replace('<div class="pad"', `<div class="card eqcard"><p class="say">那正確答案是多少？　<span class="ansbox">${D.input ? H(D.input) : '<span class="cur"></span>'}</span></p></div><div class="pad"`);
  }
  if (D.st==='judge') r += `<div class="card eqcard"><p class="say">小明的答案對嗎？</p><div class="judge"><button class="btn primary" type="button" data-j="1">⭕ 對</button><button class="btn" type="button" data-j="0">❌ 不對</button></div></div>`;
  if (D.st==='done') r += `<div class="actions"><button class="btn primary big" type="button" id="dNextBtn">下一題</button></div>`;
  $('#gRight').innerHTML = r;
}
$('#gRight').addEventListener('click', e => {
  if (!D || G) return;
  const b = e.target.closest('#dpad button'); if (b) return dPress(b.dataset.n!=null ? b.dataset.n : b.dataset.k);
  const j = e.target.closest('[data-j]'); if (j) return dJudge(j.dataset.j==='1');
  if (e.target.closest('#dNextBtn')){ D.i++; dNext(); }
});
function dPress(k){
  Sound.tap();
  if (k==='del'){ D.input = ''; return dRender(); }
  if (k!=='go'){ if (D.input.length < 3) D.input = (D.input==='0' ? '' : D.input) + k; return dRender(); }
  if (!D.input) return;
  const v = +D.input, pr = D.pr;
  if (D.st==='calc'){
    const val = x => x==='X' ? D.claim : pr[x];
    const want = D.sym[1]==='+' ? val(D.sym[0]) + val(D.sym[2]) : val(D.sym[0]) - val(D.sym[2]);
    if (v===want){ D.R = v; D.st = 'judge'; D.msg = ''; Sound.good(); return dRender(); }
    D.tries++; D.input = ''; Sound.soft();
    if (D.tries >= 2){ D.R = want; D.st = 'judge'; D.msg = `算出來是 ${want}。`; D.msgCls = ''; }
    else { D.msg = '再算一次。'; D.msgCls = 'bad'; }
    return dRender();
  }
  if (D.st==='fix'){
    if (v===pr.ans){ D.msg = '✔ 太棒了，你抓到錯誤，也算出正確答案！'; D.msgCls = 'good'; Sound.star(); P.det.caught++; save(); D.st = 'done'; }
    else { D.input = ''; D.msg = `正確答案是 ${pr.ans}。可以用驗算再檢查一次。`; D.msgCls = 'bad'; Sound.soft(); D.st = 'done'; }
    return dRender();
  }
}
function dJudge(yes){
  const pr = D.pr, same = D.R === pr[D.cmp], good = yes === D.right;
  P.det.n++; if (good) P.det.judgeOk++; if (!D.right) P.det.wrongShown++;
  save(); D.input = '';
  if (good){
    Sound.good(); D.ok++;
    if (D.right){ D.msg = `✔ 對！${D.R} 和 ${pr[D.cmp]} 一樣，小明的答案是對的。`; D.msgCls = 'good'; D.st = 'done'; }
    else { D.msg = `✔ 對！${D.R} 和 ${pr[D.cmp]} 不一樣，小明算錯了。`; D.msgCls = 'good'; D.st = 'fix'; }
  } else {
    Sound.soft();
    D.msg = same ? `再看一次：${D.R} 和 ${pr[D.cmp]} 一樣，所以小明的答案是對的。` : `再看一次：${D.R} 和 ${pr[D.cmp]} 不一樣，所以小明的答案不對。正確答案是 ${pr.ans}。`;
    D.msgCls = 'bad'; D.st = 'done';
  }
  dRender();
}
function dEnd(){
  const ok = D.ok, n = D.q.length; D = null; BRD = null;
  save(); Sound.win();
  show('result');
  $('#result').innerHTML = `<div class="r-top"><h2>🔍 偵探任務完成！</h2><span class="trend ${ok===n?'best':''}">判斷對了 ${ok} / ${n} 題</span></div>
    <p class="hello">驗算可以幫我們抓出算錯的答案。自己的答案，也可以這樣檢查喔！</p>
    <div class="row"><button class="btn primary" type="button" id="rAgain">再玩一次</button><button class="btn" type="button" id="rHome">回首頁</button></div>`;
  $('#rAgain').onclick = () => startDetect();
  $('#rHome').onclick = () => show('home');
}

    if (!$('#tp').hidden) renderTeacher();
  }
  if (id.id==='tReset'){
    if (!id.dataset.arm){ id.dataset.arm = '1'; id.textContent = '再按一次確認清除'; setTimeout(() => { if (id.isConnected){ delete id.dataset.arm; id.textContent = '清除這台裝置的紀錄'; } }, 3000); return; }
    loadP(null); save(); toast('練習紀錄已清除'); $('#tp').hidden = true; show('home');
  }
});
$('#tpBox').addEventListener('change', e => {
  const mx = e.target.closest('[data-max]');
  if (mx){ P.maxLv = +mx.dataset.max; addLog(`開放到${LEVELS[P.maxLv].name}`); save(); renderTeacher(); return; }
  if (e.target.id==='tUp'){
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if (d.app!=='pnmfact' || typeof d.cells!=='object') throw 0;
        loadP(d); addLog('讀入進度檔'); save(); toast('已讀入進度'); renderTeacher();
      }catch(err){ toast('這個檔案不是列式練習的進度檔'); }
    };
    rd.readAsText(f);
  }
});

show('home');
</script>
</body>
</html>
