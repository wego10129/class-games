<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="乘法練習">
<meta name="application-name" content="乘法練習">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E3EDF2">
<title>乘法小練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 依《數學遊戲網頁：通用設計規格書》v1.2：第 3 節學扶例外條款、3.7 家長版、第 5 節共用介面 */
:root{
  --paper:#E3EDF2; --grid:#D0DEE6; --ink:#1B2836; --ink-soft:#4C5D6E; --card:#FFFFFF; --wash:#F3F7FA;
  --hl:#FFE066; --gold:#F2B400; --good:#1FA963; --bad:#E5484D; --blue:#3A9FEF; --orange:#FF8A3D; --purple:#9466EE;
  --s-new:#FFFFFF; --s-weak:#FFB3B3; --s-learn:#FFE38A; --s-ok:#8FE0AE; --s-super:#FFC933; --s-none:#E6ECF1;
  --f-display:'LXGW WenKai TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-num:'Fredoka','Noto Sans TC',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{background:var(--paper)}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  height:100dvh; overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.wrap{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font-family:inherit;color:var(--ink)}

/* ---------- 標題列 ---------- */
.top{flex:none;display:flex;align-items:center;gap:8px 14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:26px;letter-spacing:.04em;cursor:default;white-space:nowrap}
.tagk{display:inline-block;background:var(--hl);border:3px solid var(--ink);border-radius:10px;padding:0 9px;box-shadow:3px 3px 0 var(--ink);font-family:var(--f-num);font-weight:600;font-size:20px;transform:rotate(-4deg)}
.badge{display:inline-block;font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--hl);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:700 16px var(--f-body);padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--hl)}
.btn.sm{font-size:14px;padding:4px 12px}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px}
.dim{color:var(--ink-soft);font-size:14px;font-weight:700}
.warn{color:#B4232A}

main{flex:1;min-height:0;display:flex;flex-direction:column}
main>[data-screen]{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
[data-screen="home"],[data-screen="result"]{overflow:auto;padding:0 6px 6px 0}

/* ---------- 首頁 ---------- */
.home{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.15fr);gap:16px;align-items:start}
.hello{font-weight:900;font-size:18px}
.sel-now{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.range-name{font-size:24px}
.lit{display:grid;gap:6px;margin:10px 0 4px}
.lit-txt{font-weight:900;font-size:18px}
.lit-txt b{font-family:var(--f-num);font-size:26px;margin:0 2px}
.bar{height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--s-ok),var(--s-super));border-right:3px solid var(--ink)}
.bar i[style*="width:0%"]{border-right:0}
.modes{display:grid;gap:10px;margin-top:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;width:100%;font:900 22px var(--f-body);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;background:var(--card)}
.mode:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.mode .ic{flex:none;width:54px;height:54px;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-size:28px;background:#DCEEFF}
.mode small{display:block;font-size:15px;font-weight:700;color:var(--ink-soft);line-height:1.35}
.mine{margin-top:14px;border-top:2px dashed var(--grid);padding-top:10px;display:grid;gap:6px}
.mine h3{font-size:17px}
.pref-row{display:flex;align-items:center;gap:10px;font-weight:900}
.pref-row>span{min-width:4.5em}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:2px 2px 0 var(--ink)}
.seg button{font:700 16px var(--f-body);border:0;border-left:2px solid var(--ink);background:var(--card);padding:4px 14px;cursor:pointer;min-height:38px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--hl)}

/* ---------- 亮燈表（乘法表） ---------- */
.tbl h3{font-size:18px;margin-bottom:4px}
.gridt{display:grid;gap:3px;grid-template-columns:30px repeat(10,1fr)}
.gridt .hd{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--ink-soft);display:grid;place-items:center;white-space:nowrap}
.gridt .rh{font-size:15px;color:var(--ink)}
.cell{border:2px solid var(--ink);border-radius:6px;font-family:var(--f-num);font-weight:600;font-size:clamp(9px,1.15vw,13px);display:grid;place-items:center;min-height:28px;padding:0 1px;white-space:nowrap;background:var(--s-new);position:relative;line-height:1.1}
.cell.weak{background:var(--s-weak)} .cell.learn{background:var(--s-learn)} .cell.ok{background:var(--s-ok)} .cell.super{background:var(--s-super)}
.cell.super::after{content:"★";position:absolute;top:-8px;right:-5px;font-size:12px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;display:inline-block}

/* ---------- 選範圍 ---------- */
.cover>.card.picker{width:min(620px,100%);max-width:620px;max-height:100%;overflow:auto;display:grid;gap:12px;text-align:left;justify-items:stretch}
.picker .pk-head h2{font-size:24px}
.pk-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gbtn{font:900 22px var(--f-body);text-align:left;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;background:var(--card);box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:grid;gap:2px}
.gbtn small{font:600 20px var(--f-num);color:var(--ink-soft)}
.gbtn.on{background:var(--hl)}
.gbtn.part{background:#FFF6CC}
.gbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.allbtn{justify-self:start}
.allbtn.on{background:var(--hl)}
.chips{display:grid;gap:8px;border:3px dashed var(--ink-soft);border-radius:14px;padding:10px 12px;background:var(--wash)}
.chips .cl{font-weight:900;font-size:15px}
.chiprow{display:flex;gap:10px;flex-wrap:wrap}
.segchip{font:600 22px var(--f-num);min-width:84px;min-height:48px;border:3px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:0 10px}
.segchip.on{background:var(--hl)}
.segchip.on::before{content:"✓ ";font-weight:600}
.segchip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- 練習畫面 ---------- */
.game{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(280px,36%);gap:16px}
.g-left{min-height:0;display:flex;flex-direction:column;gap:10px}
.g-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chipm{font-weight:900;border:3px solid var(--ink);border-radius:999px;padding:0 14px;background:#DCEEFF;white-space:nowrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.done{background:var(--good)}
.dots i.redo{background:var(--s-weak)}
.dots i.rev{background:var(--s-super)}
.dots i.now{background:var(--hl);transform:scale(1.25)}
.qcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;position:relative;overflow:auto;padding:12px}
.qcard::before,.qcard::after{content:'';flex:1 1 0;min-height:0}   /* 內容太多時從上面開始排，算式不會被切掉 */
.eq{display:flex;align-items:center;justify-content:center;gap:.28em;font-family:var(--f-num);font-weight:600;font-size:clamp(44px,10.5vmin,112px);line-height:1;flex-wrap:nowrap}
.eq .op{color:var(--ink-soft)}
.ans{min-width:1.9em;height:1.3em;border:4px solid var(--ink);border-radius:16px;background:var(--wash);display:grid;place-items:center;padding:0 .12em}
.ans.focus{background:#FFF8D6;box-shadow:0 0 0 6px rgba(255,224,102,.6)}
.ans.ok{background:#D9F6E5;border-color:var(--good)}
.ans.no{background:#FFE1E1;border-color:var(--bad);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ans .cur{width:4px;height:.8em;background:var(--ink-soft);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.msg{min-height:1.5em;font-weight:900;font-size:clamp(17px,3vmin,26px);text-align:center}
.msg.good{color:var(--good)} .msg.bad{color:#B4232A}
.fx{position:absolute;top:10px;right:12px;font-weight:900;font-size:clamp(16px,3vmin,24px);border:3px solid var(--ink);border-radius:14px;padding:2px 12px;background:var(--hl);animation:pop .3s ease-out;z-index:2}
.fx.super{background:var(--s-super)} .fx.ok{background:var(--s-ok)} .fx.lit{background:#E9DDFF}
@keyframes pop{from{transform:scale(.5);opacity:0}}

/* 提示：往前推 1 句＋點點＋數線 */
.hint{width:100%;max-width:640px;border:3px dashed var(--ink-soft);border-radius:16px;background:#FFFBEA;padding:8px 12px;display:grid;gap:6px;justify-items:center}
.hrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.prevbox{font:600 clamp(20px,3.6vmin,30px) var(--f-num);border:3px solid var(--ink);border-radius:12px;background:#DCEEFF;padding:0 12px;white-space:nowrap}
.plus{font:600 clamp(20px,3.6vmin,30px) var(--f-num);color:var(--ink-soft)}
.grp{display:flex;gap:4px;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:5px 7px;flex-wrap:wrap;max-width:100%}
.grp i{width:var(--d);height:var(--d);border-radius:50%;border:2px solid var(--ink);background:var(--orange);--d:clamp(14px,3vmin,24px)}
.nl{width:100%;max-width:600px;height:auto;display:block}
.nl text{font-family:var(--f-num);font-weight:600}
.steps{font-weight:900;font-size:clamp(16px,2.8vmin,24px);text-align:center;line-height:1.35}
.steps .n{font-family:var(--f-num);font-weight:600}
.steps .k{display:inline-block;border-radius:6px;padding:0 6px;background:#FFE2CC}
.reveal{font-weight:900;font-size:clamp(17px,3vmin,24px);background:var(--hl);border:2px solid var(--ink);border-radius:10px;padding:0 12px}

.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:10px;min-height:0}
.pad button{font-family:var(--f-num);font-weight:600;font-size:clamp(28px,6vmin,52px);border:3px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:4px 4px 0 var(--ink);cursor:pointer;min-height:48px}
.pad button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);background:var(--hl)}
.pad .del{font-family:var(--f-body);font-size:clamp(17px,3.2vmin,26px);font-weight:900;background:var(--wash)}
.pad .go{font-family:var(--f-body);font-size:clamp(19px,3.6vmin,30px);font-weight:900;background:var(--hl)}
.pad .go:disabled{opacity:.5}

.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;border:3px solid var(--hl);border-radius:16px;padding:10px 22px;font-weight:900;font-size:20px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pop .3s ease-out;max-width:calc(100% - 32px);text-align:center}
.cover{position:fixed;inset:0;z-index:40;background:rgba(27,40,54,.72);display:grid;place-items:center;padding:16px}
.cover>.card{max-width:520px;text-align:center;display:grid;gap:12px;justify-items:center}
.cover .big{font-size:26px;font-weight:900}

/* ---------- 聚光燈導覽 ---------- */
.tour{position:fixed;inset:0;z-index:60}
.tour .shade{position:absolute;inset:0;background:rgba(27,40,54,.72)}
.spot{position:absolute;border:4px solid var(--hl);border-radius:18px;box-shadow:0 0 0 9999px rgba(27,40,54,.72);transition:all .25s ease;pointer-events:none}
.tip{position:absolute;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));display:grid;gap:10px;z-index:2}
.tip h3{font-size:21px}
.tip p{font-weight:700;font-size:17px;line-height:1.55}
.tip .tnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tip .tstep{font:600 15px var(--f-num);color:var(--ink-soft)}
.tdemo{display:grid;gap:6px;justify-items:center;background:#FFFBEA;border:3px dashed var(--ink-soft);border-radius:14px;padding:8px}
.tdemo .eqs{font:600 30px var(--f-num)}

/* ---------- 結算 ---------- */
.result{display:grid;gap:14px}
.r-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.r-top h2{font-size:30px}
.trend{font-weight:900;font-size:18px;border:3px solid var(--ink);border-radius:999px;padding:2px 16px;background:var(--wash)}
.trend.best{background:var(--hl)} .trend.up{background:#DDF5E7;color:#127A45}
.r-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.r-row>b{margin-right:4px}
.qchip{font-family:var(--f-num);font-weight:600;font-size:18px;border:2px solid var(--ink);border-radius:10px;padding:0 10px;background:var(--wash);white-space:nowrap}
.qchip.ok{background:var(--s-ok)} .qchip.super{background:var(--s-super)} .qchip.weak{background:var(--s-weak)} .qchip.learn{background:var(--s-learn)}
.r-stats{display:flex;gap:10px;flex-wrap:wrap}
.r-stats div{border:2px solid var(--ink);border-radius:10px;padding:4px 14px;background:var(--wash);font-weight:700}
.r-stats b{font-family:var(--f-num);font-size:22px;margin-left:6px}
.r-tbl{max-width:640px}

@media (max-aspect-ratio:1/1){
  .home{grid-template-columns:1fr}
  .game{grid-template-columns:1fr;grid-template-rows:1fr auto;gap:10px}
  .pad{height:min(38vh,360px);gap:8px}
}
@media (max-width:600px){
  .brand h1{font-size:21px}
  .badge{display:none}
  .card{padding:12px;border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
  .cell{font-size:0;min-height:24px}            /* 手機：格子只看顏色，題目看列首與欄首 */
  .cell.super::after{font-size:10px;top:-7px;right:-4px}
  .gridt{grid-template-columns:24px repeat(10,1fr);gap:2px}
  .gridt .hd{font-size:11px}
  .groups{grid-template-columns:1fr}
  .gbtn{font-size:20px}
  .segchip{min-width:72px}
  .mode{font-size:20px;padding:10px 12px}
  .mode .ic{width:46px;height:46px;font-size:24px}
  .r-top h2{font-size:24px}
  .qcard{gap:6px;padding:8px}
  .hint{padding:6px 8px;gap:4px}
  .g-bar{gap:6px}
  .chipm{font-size:14px;padding:0 10px}
  .dots i{width:11px;height:11px}
}
@media (max-height:720px) and (max-aspect-ratio:1/1){
  .pad{height:34vh;gap:7px}
  .pad button{min-height:40px;border-radius:14px}
  .eq{font-size:clamp(36px,8.5vmin,64px)}
  .nl{max-height:62px;width:auto;max-width:100%}
  .prevbox,.plus{font-size:20px}
  .grp i{--d:14px}
  .steps{font-size:15px}
  .msg{font-size:16px}
}
@media (max-height:560px){ .hint .grp{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="tagk">×</span><h1 id="title">乘法小練習</h1><span class="badge" id="verBadge"></span></div>
    <div class="row">
      <button class="btn sm" id="homeBtn" type="button" hidden>回首頁</button>
    </div>
  </header>

  <main>
    <section data-screen="home"><div id="home"></div></section>

    <section data-screen="game" hidden>
      <div class="game">
        <div class="g-left">
          <div class="g-bar"><span id="gMode" class="chipm"></span><div id="gDots" class="dots"></div></div>
          <div class="card qcard">
            <div id="gFx" class="fx" hidden></div>
            <div class="eq" id="gEq"></div>
            <div id="gMsg" class="msg"></div>
            <div id="gHint" class="hint" hidden></div>
          </div>
        </div>
        <div class="pad" id="pad">
          <button type="button" data-n="7">7</button><button type="button" data-n="8">8</button><button type="button" data-n="9">9</button>
          <button type="button" data-n="4">4</button><button type="button" data-n="5">5</button><button type="button" data-n="6">6</button>
          <button type="button" data-n="1">1</button><button type="button" data-n="2">2</button><button type="button" data-n="3">3</button>
          <button type="button" class="del" data-k="del">⌫ 清除</button><button type="button" data-n="0">0</button><button type="button" class="go" data-k="go">確定</button>
        </div>
      </div>
    </section>

    <section data-screen="result" hidden><div id="result" class="card result"></div></section>
  </main>
</div>

<div id="pauseCover" class="cover" hidden><div class="card"><div class="big">休息一下</div><p>離開畫面時，這一題不算，等一下會再出一次。</p><button class="btn primary" id="resumeBtn" type="button">點一下這裡繼續</button></div></div>
<div id="pickCover" class="cover" hidden><div class="card picker" id="picker"></div></div>
<div id="clearCover" class="cover" hidden><div class="card">
  <div class="big">清除練習紀錄？</div>
  <p>這台裝置上所有題目的燈號和紀錄都會清除，清除後不能復原。</p>
  <div class="row" style="justify-content:center"><button class="btn" type="button" id="clearYes">清除紀錄</button><button class="btn primary" type="button" id="clearNo">取消</button></div>
</div></div>
<div id="tour" class="tour" hidden></div>

<script>
/* =====================================================================
   參數區（對應「主題設定表：乘法小練習（家長版）」；改數字不用動下面的程式）
   ===================================================================== */
const VERSION = {id:'mulv10', name:'家長版 v1.0'};
const GROUPS = [                        /* 範圍＝內容分段，不是難度；孩子自己選（規格書 3.7） */
  {id:'g1', name:'第一大組', segs:[2,5,4,8]},
  {id:'g2', name:'第二大組', segs:[3,6,7,9]},
];
const SEGS = GROUPS.flatMap(g => g.segs);   /* 亮燈表的列順序：2、5、4、8、3、6、7、9 段 */
const MULT_MAX = 10;                  /* 每一段 ×1～×10 */
const ROUND_OPTS = [10, 15];          /* 孩子可選的每局題數 */
const ROUND_N = 15;                   /* 每局題數（預設） */
const REDO_MAX = 5;                   /* 每局補出的題目最多幾題（15 題＋補出 ≤ 20 題） */
const REVIEW_N = 2;                   /* 每局抽幾題 🌟 回來複習（固定） */
const MASTER_SEC = 5;                 /* 沒看提示、5 秒內答對＝熟練 */
const SUPER_SEC = 3;                  /* 沒看提示、3 秒內答對＝超熟練（之後只在複習時出現） */
const REINSERT_GAP = 3;               /* 答錯的題目，隔幾個位置再出一次（中間隔 2 題） */
const GUESS_SEC = 1;                  /* 1 秒內就答錯＝可能是猜的 */
const GUESS_STREAK = 2;               /* 連續幾題快速答錯，就提醒「先想一想」 */
const STORE_KEY = 'mulfact1';         /* 瀏覽器儲存的鍵名（和加減法 mathfact1 分開） */

const STATE = {
  fresh:{name:'還沒練過', cls:'new'},
  weak: {name:'不熟',     cls:'weak'},
  learn:{name:'練習中',   cls:'learn'},
  ok:   {name:'熟練',     cls:'ok'},
  super:{name:'超熟練',   cls:'super'},
};

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = it => `${it.a}×${it.b}`;

/* ---------- 題庫：段數寫在前面（7×6 是 7 的段） ---------- */
const ALL = [];
SEGS.forEach(a => { for (let b=1;b<=MULT_MAX;b++) ALL.push({id:`${a}x${b}`, a, b, ans:a*b}); });
const BY_ID = {}; ALL.forEach(it => BY_ID[it.id] = it);

/* ---------- 儲存（只存在這台裝置；不記名字、不對外傳輸） ---------- */
const store = {
  get(){ try{ const v = localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const blankPref = () => ({n:ROUND_N, sound:true, speed:true, day:null});
const blank = () => ({app:'mulfact', ver:1, segs:null, items:{}, rounds:0, toured:false, pref:blankPref()});
let P;
function loadP(d){
  P = Object.assign(blank(), d || {});
  P.pref = Object.assign(blankPref(), P.pref || {});
  if (P.segs) P.segs = P.segs.filter(s => SEGS.includes(s));
  if (P.segs && !P.segs.length) P.segs = null;
}
loadP(store.get());
const save = () => store.set(P);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
/* 聲音、速度回饋只在當天有效：隔天自動恢復成「開」 */
if (P.pref.day !== todayStr()){ P.pref.sound = true; P.pref.speed = true; P.pref.day = todayStr(); save(); }
const rec = id => P.items[id] || (P.items[id] = {s:'fresh', seen:0, wrong:0, rts:[], last:null, best:null, at:0});
const stOf = id => (P.items[id] && P.items[id].s) || 'fresh';
const isLit = s => s==='ok' || s==='super';
const RANK = {fresh:0, weak:1, learn:2, ok:3, super:4};
const bestOf = r => r.best!=null ? r.best : (r.rts && r.rts.length ? Math.min(...r.rts) : null);
const curSegs = () => P.segs || [];
const itemsOf = segs => ALL.filter(it => segs.includes(it.a));
const litCount = segs => itemsOf(segs).filter(it => isLit(stOf(it.id))).length;
const sameSet = (x,y) => x.length===y.length && x.every(v => y.includes(v));
function segLabel(segs){
  if (!segs || !segs.length) return '還沒選練習範圍';
  if (sameSet(segs, SEGS)) return '全部（8 段）';
  const g = GROUPS.find(g => sameSet(g.segs, segs));
  if (g) return `${g.name}（${g.segs.join('、')} 段）`;
  return SEGS.filter(s => segs.includes(s)).join('、') + ' 段';
}
const segShort = segs => { const g = GROUPS.find(g => sameSet(g.segs, segs)); return sameSet(segs,SEGS) ? '全部' : g ? g.name : SEGS.filter(s => segs.includes(s)).join('、') + ' 段'; };

/* ---------- 聲音 ---------- */
const Sound = {
  ac:null, muted:false,
  init(){ if (!this.ac){ try{ this.ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if (this.ac && this.ac.state==='suspended') this.ac.resume(); },
  tone(f,d,type,when,vol){
    const ac = this.ac; if (!ac || this.muted) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime+(when||0);
    o.type = type||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol||.14,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  },
  tap(){ this.tone(520,.05,'sine',0,.06); },
  good(){ this.tone(660,.12,'triangle'); this.tone(990,.2,'triangle',.08); },
  star(){ [784,988,1319].forEach((f,i)=>this.tone(f,.16,'triangle',i*.07)); },
  soft(){ this.tone(330,.22,'sine',0,.09); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',i*.11)); }
};
Sound.muted = !P.pref.sound;
document.addEventListener('pointerdown', () => Sound.init(), {passive:true});
$('#verBadge').textContent = VERSION.name;

/* ---------- 畫面切換 ---------- */
let screen = 'home', G = null;
function show(name){
  screen = name;
  document.querySelectorAll('[data-screen]').forEach(s => s.hidden = s.dataset.screen!==name);
  $('#homeBtn').hidden = name==='home';
  if (name==='home') renderHome();
}
$('#homeBtn').addEventListener('click', () => { G = null; show('home'); });

/* ---------- 亮燈表 ---------- */
function tableHTML(segs){
  const rows = SEGS.filter(s => segs.includes(s));
  let h = `<div class="gridt"><span class="hd"></span>`;
  for (let b=1;b<=MULT_MAX;b++) h += `<span class="hd">×${b}</span>`;
  rows.forEach(a => {
    h += `<span class="hd rh">${a}</span>`;
    for (let b=1;b<=MULT_MAX;b++){
      const it = BY_ID[`${a}x${b}`], s = stOf(it.id);
      h += `<span class="cell ${STATE[s].cls}" data-id="${it.id}" title="${fmt(it)}">${fmt(it)}</span>`;
    }
  });
  const list = itemsOf(segs), lit = list.filter(it => isLit(stOf(it.id))).length;
  return `<div class="tbl"><h3>亮燈表　<span class="dim">點亮 ${lit}/${list.length}</span></h3>${h}</div></div>`;
}
const legendHTML = () => `<div class="legend">${Object.keys(STATE).map(k => `<span><i class="cell ${STATE[k].cls}" style="min-height:0"></i>${STATE[k].name}</span>`).join('')}</div>`;

/* ---------- 首頁 ---------- */
function segHTML(key, opts, cur){
  return `<div class="seg">${opts.map(([v,t]) => `<button type="button" class="${String(v)===String(cur)?'on':''}" data-pref="${key}" data-v="${v}">${t}</button>`).join('')}</div>`;
}
function renderHome(){
  const el = $('#home'), segs = curSegs(), pf = P.pref;
  const list = itemsOf(segs), total = list.length, lit = litCount(segs);
  const nWeak = list.filter(it => ['weak','learn'].includes(stOf(it.id))).length;
  const nFresh = list.filter(it => stOf(it.id)==='fresh').length;
  const tbl = segs.length ? tableHTML(segs) : `<div class="tbl"><h3>亮燈表</h3><p class="dim" style="margin-top:6px">選好練習範圍後，這裡會出現每一題的燈。</p></div>`;
  el.innerHTML = `<div class="home">
    <div class="card">
      <div class="hello">今天也來練一練！</div>
      <div class="sel-now"><h2 class="range-name">${segLabel(segs)}</h2></div>
      ${segs.length ? `<div class="lit"><div class="lit-txt">${total} 格，已經點亮 <b>${lit}</b> 格</div><div class="bar"><i style="width:${Math.round(lit/total*100)}%"></i></div></div>` : ''}
      <div class="modes">
        <button class="mode" type="button" id="hStart"><span class="ic" style="font:600 34px var(--f-num)">×</span><span>開始練習<small>${segs.length ? '找出還不熟的題目，把它們一格一格點亮！慢慢想，答錯會有提示。' : '先選這次要練習的範圍。'}</small></span></button>
        ${segs.length ? `<p class="dim">還要多練 ${nWeak} 題・還沒練過 ${nFresh} 題</p>` : ''}
        <div class="row"><button class="btn" type="button" id="hRange">📋 選擇練習範圍</button><button class="btn sm" type="button" id="hTour">怎麼玩？</button></div>
      </div>
      <div class="mine" id="hMine"><h3>我的練習設定</h3>
        <div class="pref-row"><span>每局</span>${segHTML('n', ROUND_OPTS.map(n => [n, n+' 題']), pf.n)}</div>
        <div class="pref-row"><span>聲音</span>${segHTML('sound', [[1,'開'],[0,'關']], pf.sound?1:0)}</div>
        <div class="pref-row"><span>顯示快慢</span>${segHTML('speed', [[1,'開'],[0,'關']], pf.speed?1:0)}</div>
        <p class="dim">聲音、顯示快慢只有今天有效，明天會自動打開。</p>
      </div>
    </div>
    <div class="card" id="hTable">${tbl}${legendHTML()}</div>
  </div>`;
}
$('#home').addEventListener('click', e => {
  if (e.target.closest('#hStart')) return curSegs().length ? startRound() : openPicker();
  if (e.target.closest('#hRange')) return openPicker();
  if (e.target.closest('#hTour')) return startTour();
  const b = e.target.closest('[data-pref]'); if (!b) return;
  const k = b.dataset.pref, v = b.dataset.v, pf = P.pref;
  if (k==='n') pf.n = +v;
  else if (k==='sound'){ Sound.init(); pf.sound = v==='1'; Sound.muted = !pf.sound; pf.day = todayStr(); }
  else if (k==='speed'){ pf.speed = v==='1'; pf.day = todayStr(); }
  save(); renderHome();
});

/* ---------- 選擇練習範圍：兩個大組；按下後展開 4 個段，可以單選某一段 ---------- */
let pick = null;   /* {segs:[...], open:'g1'|'g2'|'all'} */
function openPicker(){
  const s = curSegs().slice();
  let open = 'g1';
  if (s.length){
    if (s.every(v => GROUPS[0].segs.includes(v))) open = 'g1';
    else if (s.every(v => GROUPS[1].segs.includes(v))) open = 'g2';
    else open = 'all';
  }
  pick = {segs:s, open};
  renderPicker(); $('#pickCover').hidden = false;
}
function renderPicker(){
  const s = pick.segs;
  const gState = g => g.segs.every(v => s.includes(v)) && s.length===g.segs.length ? 'on' : g.segs.some(v => s.includes(v)) ? 'part' : '';
  const shown = pick.open==='all' ? GROUPS : GROUPS.filter(g => g.id===pick.open);
  const n = itemsOf(s).length;
  $('#picker').innerHTML = `
    <div class="pk-head"><h2>這次要練哪些？</h2>${P.segs ? '<button class="btn sm" type="button" id="pkCancel">取消</button>' : ''}</div>
    <div class="groups">${GROUPS.map(g => `<button type="button" class="gbtn ${pick.open!=='all'?gState(g):''}" data-g="${g.id}">${g.name}<small>${g.segs.join('、')} 段</small></button>`).join('')}</div>
    <button type="button" class="btn sm allbtn ${sameSet(s,SEGS)?'on':''}" data-g="all">全部 8 段一起練</button>
    ${shown.map(g => `<div class="chips"><div class="cl">${g.name}：想只練某一段，就把其他段取消</div>
      <div class="chiprow">${g.segs.map(v => `<button type="button" class="segchip ${s.includes(v)?'on':''}" data-seg="${v}">${v} 段</button>`).join('')}</div></div>`).join('')}
    <div class="row" style="justify-content:space-between">
      <span class="dim">${s.length ? `已選：${segLabel(s)}，共 ${n} 題` : '請至少選一段'}</span>
      <button class="btn primary" type="button" id="pkOk" ${s.length?'':'disabled'}>就練這些</button>
    </div>`;
}
$('#picker').addEventListener('click', e => {
  if (e.target.closest('#pkCancel')){ $('#pickCover').hidden = true; return; }
  if (e.target.closest('#pkOk')){
    if (!pick.segs.length) return;
    P.segs = SEGS.filter(v => pick.segs.includes(v)); save();
    $('#pickCover').hidden = true; renderHome(); return;
  }
  const g = e.target.closest('[data-g]');
  if (g){
    if (g.dataset.g==='all'){ pick.segs = SEGS.slice(); pick.open = 'all'; }
    else { const grp = GROUPS.find(x => x.id===g.dataset.g); pick.segs = grp.segs.slice(); pick.open = grp.id; }
    return renderPicker();
  }
  const c = e.target.closest('[data-seg]');
  if (c){
    const v = +c.dataset.seg, i = pick.segs.indexOf(v);
    if (i>=0) pick.segs.splice(i,1); else pick.segs.push(v);
    return renderPicker();
  }
});

/* ---------- 出題 ---------- */
function spread(list){
  /* 同一段盡量不連續出現 */
  const out = [], rest = shuffle(list.slice());
  while (rest.length){
    const last = out.length ? out[out.length-1].a : null;
    let k = rest.findIndex(it => it.a!==last); if (k<0) k = 0;
    out.push(rest.splice(k,1)[0]);
  }
  return out;
}
function buildRound(){
  const n = P.pref.n || ROUND_N, all = itemsOf(curSegs());
  const pool = all.filter(it => stOf(it.id)!=='super');
  /* 🌟 複習：固定抽 REVIEW_N 題，最久沒做的優先 */
  const supers = shuffle(all.filter(it => stOf(it.id)==='super')).sort((a,b) => (rec(a.id).at||0)-(rec(b.id).at||0));
  const review = supers.slice(0, REVIEW_N);
  const by = {weak:[], fresh:[], ok:[]};
  pool.forEach(it => { const s = stOf(it.id); (s==='weak'||s==='learn' ? by.weak : s==='fresh' ? by.fresh : by.ok).push(it); });
  /* 不熟的排前面，答錯次數多的優先 */
  shuffle(by.weak).sort((a,b) => (stOf(a.id)==='weak'?0:1)-(stOf(b.id)==='weak'?0:1) || rec(b.id).wrong-rec(a.id).wrong);
  /* 還沒練過的：照段的順序、乘數由小到大先出（第一次學乘法，從前面的句子開始） */
  shuffle(by.fresh).sort((a,b) => a.b-b.b);
  shuffle(by.ok);
  const rest = n - review.length, k = Math.ceil(rest/3);
  const m = Math.min(rest, pool.length), pick = [];
  const take = (arr,c) => { while (c-- > 0 && arr.length && pick.length < m) pick.push(arr.shift()); };
  take(by.weak, k); take(by.fresh, k); take(by.ok, rest - 2*k);
  [by.weak, by.fresh, by.ok].forEach(arr => take(arr, m));
  return {list: spread(pick.concat(review)), review: new Set(review.map(it => it.id))};
}

/* ---------- 一局 ---------- */
function startRound(){
  const segs = curSegs();
  if (!segs.length) return openPicker();
  const b = buildRound(), q = b.list;
  if (!q.length){ return toast('這個範圍沒有題目可以練', 3000); }
  const snap = {}; itemsOf(segs).forEach(it => snap[it.id] = stOf(it.id));
  G = {q:q.map(it => ({it, redo:false, review:b.review.has(it.id)})), i:0, snap, log:[], redone:new Set(), fastStreak:0, litBefore:litCount(segs), roundsBefore:P.rounds, segs:segs.slice()};
  show('game');
  $('#gMode').textContent = '× ' + segShort(segs);
  nextQ();
}
function renderDots(){
  $('#gDots').innerHTML = G.q.map((e,i) => `<i class="${i<G.i?'done':i===G.i?'now':e.redo?'redo':e.review?'rev':''}"></i>`).join('');
}
function renderEq(state){
  const it = G.cur;
  const v = G.input ? `<span>${G.input}</span>` : '<span class="cur"></span>';
  $('#gEq').innerHTML = `<span>${it.a}</span><span class="op">×</span><span>${it.b}</span><span class="op">＝</span><span class="ans ${state||'focus'}" id="gAns">${v}</span>`;
}
function nextQ(){
  if (!G) return;
  if (G.i >= G.q.length) return endRound();
  G.cur = G.q[G.i].it; G.input = ''; G.wrongs = 0; G.voided = false; G.lock = false; G.firstFast = null;
  $('#gHint').hidden = true; $('#gMsg').textContent = ''; $('#gMsg').className = 'msg'; $('#gFx').hidden = true;
  renderEq(); renderDots(); updGo();
  G.start = performance.now();
}
function updGo(){ document.querySelector('.pad .go').disabled = !G || !G.input; }
function press(k){
  if (!G || G.lock || screen!=='game') return;
  Sound.tap();
  if (k==='del') G.input = '';
  else if (k==='go') return submit();
  else if (G.input.length < 2) G.input = (G.input==='0' ? '' : G.input) + k;
  renderEq(); updGo();
}
$('#pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  press(b.dataset.n!=null ? b.dataset.n : b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (screen!=='game' || !$('#tour').hidden) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key==='Backspace'){ e.preventDefault(); press('del'); }
  else if (e.key==='Enter') press('go');
});

function submit(){
  if (!G.input) return;
  const it = G.cur, v = +G.input, rt = (performance.now() - G.start) / 1000;
  if (v === it.ans) return correct(rt);
  /* 答錯：不能直接跳下一題，先看提示再重答 */
  G.wrongs++;
  if (G.wrongs===1){
    const fast = rt < GUESS_SEC;
    G.firstFast = fast;
    if (fast){
      G.fastStreak++;
      if (G.fastStreak >= GUESS_STREAK){ toast('先想一想再按，慢慢來沒關係 🙂', 2200); G.fastStreak = 0; }
    } else G.fastStreak = 0;
  }
  Sound.soft();
  G.input = ''; renderEq('no');
  $('#gMsg').className = 'msg bad';
  $('#gMsg').textContent = G.wrongs===1 ? '再想想看，看看下面的提示' : '沒關係，照著提示再試一次';
  showHint(it, G.wrongs >= 2);
  updGo();
}
function correct(rt){
  G.lock = true;
  const ent = G.q[G.i], it = G.cur, r = rec(it.id), before = r.s, prevRt = r.last, prevBest = bestOf(r);
  if (G.wrongs===0 && G.firstFast!==true) G.fastStreak = 0;
  r.seen++; r.at = Date.now();
  const clean = !G.wrongs && !G.voided;           /* 沒看提示、沒離開畫面 */
  const timed = clean && !ent.redo;               /* 補出的題目剛看過答案，秒數不列入紀錄 */
  let after;
  if (G.wrongs > 0){ r.wrong++; after = 'weak'; }                        /* 答錯過或看了提示 → 不熟 */
  else if (G.voided){ after = before; }                                  /* 中途離開：這一次不算，狀態不升也不降 */
  else {
    after = rt <= SUPER_SEC ? 'super' : rt <= MASTER_SEC ? 'ok' : 'learn';
    if (ent.redo){                                                       /* 補出的題目：同一局不升級，最高到 🟨（原本更高就維持） */
      const cap = Math.max(RANK[before], RANK.learn);
      if (RANK[after] > cap) after = before==='fresh' || before==='weak' ? 'learn' : before;
    }
  }
  let newBest = false;
  if (timed){
    r.rts.push(+rt.toFixed(2)); if (r.rts.length > 5) r.rts.shift();   /* 秒數只保留最近 5 次 */
    r.last = +rt.toFixed(2);
    if (prevBest==null || rt < prevBest){ newBest = prevBest!=null && rt < prevBest - 0.05; r.best = +rt.toFixed(2); }
  }
  r.s = after; save();
  const speedItem = RANK[before] >= RANK.learn && timed;                 /* 已經會算的題目才顯示速度 */
  const showSpeed = speedItem && P.pref.speed;
  G.log.push({id:it.id, before, after, rt: timed ? rt : null, prevRt, wrongs:G.wrongs, speed:speedItem, best:speedItem && newBest, review:ent.review && !ent.redo});

  /* 答錯過（或中途離開）的題目，隔 2 題再出一次；每局最多補 REDO_MAX 題 */
  if ((G.wrongs>0 || G.voided) && !G.redone.has(it.id) && G.redone.size < REDO_MAX){
    G.redone.add(it.id);
    G.q.splice(Math.min(G.i + REINSERT_GAP, G.q.length), 0, {it, redo:true, review:false});
  }

  renderEq('ok');
  const m = $('#gMsg'); m.className = 'msg good';
  const fx = $('#gFx'); fx.hidden = true;
  if (showSpeed){
    let t = '答對了！';
    if (newBest) t += '🏅 這題你的最快紀錄！';
    else if (prevRt!=null && rt < prevRt - 0.05) t += `比上次快 ${(prevRt-rt).toFixed(1)} 秒`;
    m.textContent = t;
    if (rt <= SUPER_SEC){ fx.className = 'fx super'; fx.textContent = '🌟 超熟練！'; fx.hidden = false; Sound.star(); }
    else if (rt <= MASTER_SEC){ fx.className = 'fx ok'; fx.textContent = '⚡ 熟練！'; fx.hidden = false; Sound.good(); }
    else Sound.good();
  } else {
    m.textContent = (G.wrongs || G.voided) && G.q.some((e,k) => k > G.i && e.it.id===it.id) ? '答對了！等一下會再考你一次喔' : '答對了！';
    if (!isLit(before) && isLit(after)){ fx.className = 'fx lit'; fx.textContent = '✨ 點亮一格！'; fx.hidden = false; Sound.star(); }
    else Sound.good();
  }
  const g = G;
  setTimeout(() => { if (G===g){ G.i++; nextQ(); } }, G.wrongs ? 1400 : 900);
}

/* ---------- 提示：往前推 1 句＋點點＋數線 ---------- */
const dotsHTML = n => `<div class="grp">${'<i></i>'.repeat(n)}</div>`;
function numberLine(start, step){
  /* 從 start 往後數 step 格；只標起點和終點「？」，每一跳上面寫 1、2、3… */
  const gap = 46, pad = 26, w = pad*2 + gap*step, y = 52;
  let s = `<svg class="nl" viewBox="0 0 ${w} 84" role="img" aria-label="數線：從 ${start} 往後數 ${step} 格">`;
  s += `<line x1="${pad-14}" y1="${y}" x2="${w-pad+14}" y2="${y}" stroke="#1B2836" stroke-width="3" stroke-linecap="round"/>`;
  for (let i=0;i<=step;i++){
    const x = pad + i*gap;
    s += `<line x1="${x}" y1="${y-8}" x2="${x}" y2="${y+8}" stroke="#1B2836" stroke-width="3"/>`;
    if (i>0){
      const x0 = x - gap;
      s += `<path d="M${x0+4} ${y-10} Q${x0+gap/2} ${y-36} ${x-4} ${y-10}" fill="none" stroke="#FF8A3D" stroke-width="3"/>`;
      s += `<text x="${x0+gap/2}" y="${y-30}" text-anchor="middle" font-size="15" fill="#4C5D6E">${i}</text>`;
    }
  }
  s += `<text x="${pad}" y="${y+28}" text-anchor="middle" font-size="20" fill="#1B2836">${start}</text>`;
  s += `<text x="${pad+gap*step}" y="${y+28}" text-anchor="middle" font-size="20" fill="#E5484D">？</text>`;
  return s + '</svg>';
}
function showHint(it, reveal){
  const N = n => `<span class="n">${n}</span>`;
  let h;
  if (it.b===1){
    h = `<div class="hrow">${dotsHTML(it.a)}</div>
         <div class="steps">${N(it.a)}×${N(1)} 就是 ${N(1)} 個 <span class="k">${N(it.a)}</span>，一共幾個？</div>`;
  } else {
    const prev = it.a*(it.b-1);
    h = `<div class="hrow"><span class="prevbox">${it.a}×${it.b-1}＝${prev}</span><span class="plus">＋</span>${dotsHTML(it.a)}</div>
         ${numberLine(prev, it.a)}
         <div class="steps">${N(it.a)}×${N(it.b-1)}＝${N(prev)}，再加一個 <span class="k">${N(it.a)}</span><br>${N(prev)}＋${N(it.a)}＝？</div>`;
  }
  $('#gHint').innerHTML = h + (reveal ? `<div class="reveal">答案是 ${N(it.ans)}，輸入看看</div>` : '');
  $('#gHint').hidden = false;
}

/* ---------- 離開畫面：這一次不算，回來再出一次 ---------- */
function pause(){
  if (screen!=='game' || !G || G.lock) return;
  G.voided = true;
  $('#pauseCover').hidden = false;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', pause);
window.addEventListener('pagehide', pause);
$('#resumeBtn').addEventListener('click', () => {
  $('#pauseCover').hidden = true;
  if (G && !G.lock) G.start = performance.now();
});

/* ---------- 結算：只和自己比 ---------- */
function endRound(){
  const g = G; G = null;
  const segs = g.segs, litAfter = litCount(segs), total = itemsOf(segs).length, gain = litAfter - g.litBefore;
  P.rounds++; save();
  Sound.win();

  let trend;
  if (g.roundsBefore===0) trend = {cls:'best', text:'🚀 第一次練習！'};
  else if (gain > 0) trend = {cls:'up', text:`👍 這一局點亮了 ${gain} 格！`};
  else if (gain === 0) trend = {cls:'', text:'💪 穩住了！'};
  else trend = {cls:'', text:'🔁 再練一局，把它們點亮回來！'};

  const ids = [...new Set(g.log.map(l => l.id))];
  const chip = id => { const it = BY_ID[id], s = stOf(id); return `<span class="qchip ${STATE[s].cls}">${fmt(it)}</span>`; };
  const newly = ids.filter(id => !isLit(g.snap[id]) && isLit(stOf(id)));
  const weakNow = ids.filter(id => ['weak','learn'].includes(stOf(id)));
  const firstTry = g.log.filter(l => !l.wrongs).length;
  const newSuper = ids.filter(id => g.snap[id]!=='super' && stOf(id)==='super');
  const rev = g.log.filter(l => l.review), revKeep = rev.filter(l => l.after==='super').length;

  const sp = P.pref.speed ? g.log.filter(l => l.speed) : [];
  const faster = sp.filter(l => l.prevRt!=null && l.rt < l.prevRt - 0.05).length;
  const bests = sp.filter(l => l.best).length;
  const extra = `<div class="r-stats"><div>一次就答對<b>${firstTry}</b> 題</div><div>練了<b>${g.log.length}</b> 次</div>` +
    (sp.length ? `<div>⚡ 比上次快<b>${faster}</b> 題</div>` : '') + (bests ? `<div>🏅 最快紀錄<b>${bests}</b> 題</div>` : '') +
    (rev.length ? `<div>🌟 複習穩住<b>${revKeep}/${rev.length}</b> 題</div>` : '') + `</div>`;

  show('result');
  $('#result').innerHTML = `
    <div class="r-top"><h2>🎉 練習完成！</h2><span class="trend ${trend.cls}">${trend.text}</span></div>
    <div class="lit" style="max-width:560px"><div class="lit-txt">${total} 格，已經點亮 <b>${litAfter}</b> 格</div><div class="bar"><i style="width:${Math.round(litAfter/total*100)}%"></i></div></div>
    ${extra}
    ${newSuper.length ? `<div class="r-row"><b>🌟 超熟練，之後偶爾抽考：</b>${newSuper.map(chip).join('')}</div>` : ''}
    ${newly.filter(id => !newSuper.includes(id)).length ? `<div class="r-row"><b>✨ 新點亮：</b>${newly.filter(id => !newSuper.includes(id)).map(chip).join('')}</div>` : ''}
    <div class="r-row"><b>${weakNow.length ? '🔍 下一局會多練：' : '這一局的題目都點亮了，太厲害了！'}</b>${weakNow.map(chip).join('')}</div>
    <div class="r-tbl">${tableHTML(segs)}${legendHTML()}</div>
    <div class="row">
      <button class="btn primary" type="button" id="rAgain">再練一局</button>
      <button class="btn" type="button" id="rHome">回首頁</button>
    </div>`;
  $('#rAgain').onclick = () => startRound();
  $('#rHome').onclick = () => show('home');
}

/* ---------- 小提示 ---------- */
function toast(text, ms){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms||2000);
}

/* ---------- 清除紀錄：連點標題 5 下（只在首頁）＋按兩次確認 ---------- */
let tClicks = 0, tTimer = 0;
$('#title').addEventListener('click', () => {
  tClicks++; clearTimeout(tTimer); tTimer = setTimeout(() => tClicks = 0, 2000);
  if (tClicks >= 5 && screen==='home'){ tClicks = 0; $('#clearCover').hidden = false; }
});
$('#clearNo').addEventListener('click', () => { const y = $('#clearYes'); delete y.dataset.arm; y.textContent = '清除紀錄'; $('#clearCover').hidden = true; });
$('#clearYes').addEventListener('click', () => {
  const y = $('#clearYes');
  if (!y.dataset.arm){ y.dataset.arm = '1'; y.textContent = '再按一次：確定清除'; setTimeout(() => { delete y.dataset.arm; y.textContent = '清除紀錄'; }, 3000); return; }
  delete y.dataset.arm; y.textContent = '清除紀錄';
  const keep = {pref:P.pref, toured:P.toured};
  loadP(keep); save();
  $('#clearCover').hidden = true; toast('練習紀錄已清除'); show('home');
});

/* ---------- 聚光燈導覽（第一次使用；可以略過；首頁「怎麼玩？」可以再看） ---------- */
const TOUR = [
  {sel:'#hStart', title:'開始練習', text:'準備好就按這裡。每次 10 或 15 題，畫面上沒有倒數計時，慢慢想沒關係。'},
  {sel:'#hRange', title:'選擇練習範圍', text:'按這裡選要練的段：可以選一整組，也可以只練某一段，例如只練 7 段。'},
  {sel:null, title:'用數字鍵作答', demo:true, text:'看到題目，用數字鍵輸入答案，再按「確定」。答錯了也沒關係，會出現提示：從會的前一句往後加一個數。'},
  {sel:'#hTable', title:'把燈點亮', text:'每一題都有一盞燈。答得又對又順，燈就會亮起來；變成星星的題目，之後偶爾會抽出來複習。'},
  {sel:'#hMine', title:'我的練習設定', text:'每局題數、聲音、顯示快慢，都可以自己選。'},
];
let tourI = 0;
function startTour(){ if (screen!=='home') show('home'); tourI = 0; $('#tour').hidden = false; renderTour(); }
function endTour(){
  $('#tour').hidden = true; $('#tour').innerHTML = '';
  if (!P.toured){ P.toured = true; save(); }
  if (!P.segs) openPicker();
}
function renderTour(){
  const st = TOUR[tourI], el = $('#tour');
  const target = st.sel && document.querySelector(st.sel);
  const last = tourI===TOUR.length-1;
  const demo = st.demo ? `<div class="tdemo"><div class="eqs">7×6＝？</div><div class="dim">提示：7×5＝35，再加一個 7 → 35＋7＝？</div></div>` : '';
  el.innerHTML = `${target ? '<div class="spot" id="tSpot"></div>' : '<div class="shade"></div>'}
    <div class="card tip" id="tTip"><h3>${st.title}</h3>${demo}<p>${st.text}</p>
      <div class="tnav"><button class="btn sm" type="button" id="tSkip">${last ? '' : '略過'}</button><span class="tstep">${tourI+1} / ${TOUR.length}</span>
      <button class="btn primary" type="button" id="tNext">${last ? '開始使用' : '下一步'}</button></div></div>`;
  if (last) $('#tSkip').style.visibility = 'hidden';
  const tip = $('#tTip');
  if (target){
    target.scrollIntoView({block:'center', behavior:'auto'});
    const r = target.getBoundingClientRect(), sp = $('#tSpot'), m = 6;
    sp.style.left = (r.left-m)+'px'; sp.style.top = (r.top-m)+'px'; sp.style.width = (r.width+m*2)+'px'; sp.style.height = (r.height+m*2)+'px';
    const th = tip.offsetHeight, vh = window.innerHeight;
    let top = r.bottom + 16;
    if (top + th > vh - 8) top = r.top - th - 16;
    if (top < 8) top = Math.max(8, vh - th - 8);
    tip.style.top = top + 'px';
  } else {
    tip.style.top = Math.max(8, (window.innerHeight - tip.offsetHeight)/2) + 'px';
  }
}
$('#tour').addEventListener('click', e => {
  if (e.target.closest('#tSkip')) return endTour();
  if (e.target.closest('#tNext')){ if (tourI >= TOUR.length-1) return endTour(); tourI++; renderTour(); }
});
window.addEventListener('resize', () => { if (!$('#tour').hidden) renderTour(); });

show('home');
if (!P.toured) startTour();
else if (!P.segs) openPicker();
</script>
