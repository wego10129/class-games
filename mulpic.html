<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="認識乘法">
<meta name="application-name" content="認識乘法">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E3EDF2">
<title>認識乘法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 外觀沿用乘法小練習（mul.html）；認識乘法的意義：看圖、文字題、連加和倍、被乘數・乘數・積 */
:root{
  --paper:#E3EDF2; --grid:#D0DEE6; --ink:#1B2836; --ink-soft:#4C5D6E; --card:#FFFFFF; --wash:#F3F7FA;
  --hl:#FFE066; --good:#1FA963; --bad:#E5484D; --orange:#FF8A3D;
  --f-display:'LXGW WenKai TC','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-num:'Fredoka','Noto Sans TC',sans-serif;
  --f-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{background:var(--paper)}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  height:100vh; height:100dvh; overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.wrap{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.25}
p{margin:0}
button{font-family:inherit;color:var(--ink)}

/* ---------- 標題列 ---------- */
.top{flex:none;display:flex;align-items:center;gap:8px 14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:26px;letter-spacing:.04em;cursor:default;white-space:nowrap}
.tagk{display:inline-block;background:var(--hl);border:3px solid var(--ink);border-radius:10px;padding:0 9px;box-shadow:3px 3px 0 var(--ink);font-family:var(--f-num);font-weight:600;font-size:20px;transform:rotate(-4deg)}
.badge{display:inline-block;font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--hl);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:700 16px var(--f-body);padding:8px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--hl)}
.btn.sm{font-size:14px;padding:4px 12px}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px}
.dim{color:var(--ink-soft);font-size:14px;font-weight:700}

main{flex:1;min-height:0;display:flex;flex-direction:column}
main>[data-screen]{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
[data-screen="home"],[data-screen="result"]{overflow:auto;padding:0 6px 6px 0}

/* ---------- 注音（字的右邊直排；破音字用「詞」來標，見程式的 WORDS） ---------- */
.zc{display:inline-flex;align-items:center;white-space:nowrap;vertical-align:baseline}
.zr{display:inline-flex;align-items:center;margin-left:.06em;font:400 max(.33em,9px)/1 var(--f-body);color:var(--ink)}
.zs{display:inline-flex;flex-direction:column;align-items:center;line-height:1.02}
.zt{align-self:center;margin-left:.02em;font-size:1.1em}
.zl{font-size:1.1em;line-height:.6}
.zy-on .line,.zy-on .ask{line-height:1.6}

/* ---------- 首頁 ---------- */
.home{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:16px;align-items:start}
.hello{font-weight:900;font-size:18px}
.modes{display:grid;gap:10px;margin-top:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;width:100%;font:900 22px var(--f-body);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;background:var(--card);text-decoration:none;color:var(--ink)}
.mode:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.mode .ic{flex:none;width:52px;height:52px;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-size:26px;background:#DCEEFF;font-family:var(--f-emoji)}
.mode small{display:block;font-size:15px;font-weight:700;color:var(--ink-soft);line-height:1.35}
.mode.mix{background:#FFFBEA}
.mine{margin-top:14px;border-top:2px dashed var(--grid);padding-top:10px;display:grid;gap:8px}
.mine h3{font-size:17px}
.pref-row{display:flex;align-items:center;gap:10px;font-weight:900;flex-wrap:wrap}
.pref-row>span{min-width:4.5em}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:2px 2px 0 var(--ink)}
.seg button{font:700 16px var(--f-body);border:0;border-left:2px solid var(--ink);background:var(--card);padding:4px 14px;cursor:pointer;min-height:38px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--hl)}
.learn h3{font-size:20px;margin-bottom:8px}
.learn .say{font-weight:900;font-size:21px;line-height:1.9}
.learn .say b{font-family:var(--f-num);font-size:24px;display:inline-block;min-width:1.2em;text-align:center;border-bottom:3px solid var(--ink)}
.learn .eqx{font:600 28px var(--f-num);margin-top:4px}
.learn .terms{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:10px;font-weight:700}
.learn .terms span:nth-child(odd){font-weight:900}
.tA{background:#FFE2CC;border-radius:6px;padding:0 6px}
.tB{background:#DCEEFF;border-radius:6px;padding:0 6px}
.tC{background:#D9F6E5;border-radius:6px;padding:0 6px}

/* ---------- 練習畫面 ---------- */
.game{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(240px,30%);gap:16px}
.g-left{min-height:0;display:flex;flex-direction:column;gap:10px}
.g-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chipm{font-weight:900;border:3px solid var(--ink);border-radius:999px;padding:0 14px;background:#DCEEFF;white-space:nowrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.done{background:var(--good)}
.dots i.miss{background:#FFB3B3}
.dots i.now{background:var(--hl);transform:scale(1.25)}
.qcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto;padding:12px;position:relative}
.qcard::before,.qcard::after{content:'';flex:1 1 0;min-height:0}

/* 題目：圖或文字 */
.prompt{display:grid;gap:10px;justify-items:center;width:100%}
.ask{font-weight:900;font-size:clamp(20px,3.8vmin,32px);text-align:center;max-width:760px;line-height:1.5}
.ask .n,.line .n{font-family:var(--f-num);font-weight:600;color:#C2410C}
.story{display:flex;gap:12px;align-items:center;background:#FFFBEA;border:3px solid var(--ink);border-radius:16px;padding:10px 16px;max-width:780px}
.story .em{font-family:var(--f-emoji);font-size:clamp(34px,7vmin,60px);flex:none}
.story .ask{text-align:left}
.bigeq{font:600 clamp(30px,6.5vmin,56px) var(--f-num);background:#FFFBEA;border:3px solid var(--ink);border-radius:16px;padding:4px 20px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .15em}
.bigeq .ad{position:relative;display:inline-block}
.bigeq .ad .no{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:13px;background:var(--orange);color:#fff;border:2px solid var(--ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;line-height:1}
.pic{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1.6vmin,16px);max-width:100%}
.box{position:relative;border:3px solid var(--ink);border-radius:18px;padding:8px;display:grid;gap:2px;justify-content:center;align-content:center;transition:box-shadow .2s}
.box .it{font-family:var(--f-emoji);font-size:var(--e);line-height:1.15;width:1.2em;text-align:center;position:relative}
.box.hl{box-shadow:0 0 0 6px var(--hl)}
.box .no{position:absolute;top:-14px;left:-12px;font:600 17px var(--f-num);background:var(--orange);color:#fff;border:2px solid var(--ink);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;padding:0 4px}
.box .it .no{top:-6px;left:auto;right:-8px;font-size:12px;min-width:18px;height:18px;background:var(--ink)}
.u-plate{background:#FFF4E0;border-radius:50%/40%}
.u-bag{background:#F3E8FF;border-radius:10px 10px 22px 22px}
.u-box{background:#E8F4FF;border-radius:8px}
.u-basket{background:#FDEBD3;border-radius:6px 6px 26px 26px}
.u-bowl{background:#FFE8EC;border-radius:8px 8px 40px 40px}

/* 填空 */
.lines{display:grid;gap:10px;justify-items:center;width:100%}
.line{display:flex;align-items:center;justify-content:center;gap:.25em;flex-wrap:wrap;font-weight:900;font-size:clamp(20px,4.2vmin,36px);line-height:1.3}
.line .lab{color:var(--ink-soft)}
.line.wait{opacity:.3}
.line .x{font-family:var(--f-num);font-weight:600;color:var(--ink-soft)}
.line .shown{font:600 1.1em var(--f-num);padding:0 .1em}
.slot{display:inline-grid;justify-items:center;gap:2px}
.bl{font:600 1em var(--f-num);min-width:1.6em;height:1.35em;border:4px solid var(--ink);border-radius:14px;background:var(--wash);display:grid;place-items:center;padding:0 .12em;cursor:pointer;line-height:1}
.bl:disabled{cursor:default;color:var(--ink)}
.bl.focus{background:#FFF8D6;box-shadow:0 0 0 6px rgba(255,224,102,.6)}
.bl.ok{background:#D9F6E5;border-color:var(--good)}
.bl.no{background:#FFE1E1;border-color:var(--bad);animation:shake .35s}
.bl .cur{width:4px;height:.8em;background:var(--ink-soft);animation:blink 1s steps(1) infinite}
.units{display:inline-flex;gap:.25em;align-items:center}
.ub{font:900 .9em var(--f-body);min-width:1.9em;min-height:1.45em;border:4px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:0 .2em;line-height:1.1}
.ub.on{background:var(--hl)}
.ub.ok{background:#D9F6E5;border-color:var(--good)}
.ub.no{background:#FFE1E1;border-color:var(--bad);animation:shake .35s}
.ub:disabled{cursor:default;box-shadow:none;opacity:.35}
.ub.ok:disabled{opacity:1}
.term{font:900 clamp(12px,2vmin,15px) var(--f-body);white-space:nowrap;line-height:1.2}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes blink{50%{opacity:0}}
.msg{min-height:1.5em;font-weight:900;font-size:clamp(17px,3vmin,24px);text-align:center;max-width:680px;line-height:1.6}
.msg.good{color:var(--good)} .msg.bad{color:#B4232A}
.sum{font-weight:900;font-size:clamp(16px,2.8vmin,22px);text-align:center;background:#FFFBEA;border:3px dashed var(--ink-soft);border-radius:14px;padding:6px 14px;max-width:680px;line-height:1.7}
.sum .n{font-family:var(--f-num);font-weight:600}

.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:10px;min-height:0}
.pad button{font-family:var(--f-num);font-weight:600;font-size:clamp(28px,6vmin,52px);border:3px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:4px 4px 0 var(--ink);cursor:pointer;min-height:48px}
.pad button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);background:var(--hl)}
.pad .del{font-family:var(--f-body);font-size:clamp(15px,2.6vmin,22px);font-weight:900;background:var(--wash);white-space:nowrap;padding:0 4px}
.pad .go{font-family:var(--f-body);font-size:clamp(19px,3.6vmin,30px);font-weight:900;background:var(--hl)}
.pad .go:disabled{opacity:.5}

.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;border:3px solid var(--hl);border-radius:16px;padding:10px 22px;font-weight:900;font-size:20px;box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.cover{position:fixed;inset:0;z-index:40;background:rgba(27,40,54,.72);display:grid;place-items:center;padding:16px}
.cover>.card{max-width:520px;text-align:center;display:grid;gap:12px;justify-items:center}
.cover .big{font-size:26px;font-weight:900}

/* ---------- 結算 ---------- */
.result{display:grid;gap:14px}
.r-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.r-top h2{font-size:30px}
.r-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.r-row>b{margin-right:4px}
.qchip{font-family:var(--f-num);font-weight:600;font-size:18px;border:2px solid var(--ink);border-radius:10px;padding:0 10px;background:#8FE0AE;white-space:nowrap}
.qchip.miss{background:#FFB3B3}
.r-stats{display:flex;gap:10px;flex-wrap:wrap}
.r-stats div{border:2px solid var(--ink);border-radius:10px;padding:4px 14px;background:var(--wash);font-weight:700}
.r-stats b{font-family:var(--f-num);font-size:22px;margin-left:6px}

@media (max-aspect-ratio:1/1){
  .home{grid-template-columns:1fr}
  .game{grid-template-columns:1fr;grid-template-rows:1fr auto;gap:10px}
  .pad{height:min(28vh,280px);gap:8px}
}
@media (max-width:600px){
  .brand h1{font-size:21px}
  .badge{display:none}
  .card{padding:12px;border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
  .mode{font-size:20px;padding:10px 12px}
  .mode .ic{width:44px;height:44px;font-size:22px}
  .qcard{gap:8px;padding:8px}
  .chipm{font-size:14px;padding:0 10px}
  .dots i{width:11px;height:11px}
  .story{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="tagk">×</span><h1 id="title">認識乘法</h1><span class="badge" id="verBadge"></span></div>
    <div class="row">
      <a class="btn sm" id="backBtn" href="index.html">← 回到上一頁</a>
      <button class="btn sm" id="homeBtn" type="button" hidden>回首頁</button>
    </div>
  </header>

  <main>
    <section data-screen="home"><div id="home"></div></section>

    <section data-screen="game" hidden>
      <div class="game">
        <div class="g-left">
          <div class="g-bar"><span id="gMode" class="chipm"></span><div id="gDots" class="dots"></div></div>
          <div class="card qcard" id="gCard">
            <div class="prompt" id="gPrompt"></div>
            <div class="lines" id="gLines"></div>
            <div id="gMsg" class="msg"></div>
            <div id="gSum" class="sum" hidden></div>
          </div>
        </div>
        <div class="pad" id="pad">
          <button type="button" data-n="7">7</button><button type="button" data-n="8">8</button><button type="button" data-n="9">9</button>
          <button type="button" data-n="4">4</button><button type="button" data-n="5">5</button><button type="button" data-n="6">6</button>
          <button type="button" data-n="1">1</button><button type="button" data-n="2">2</button><button type="button" data-n="3">3</button>
          <button type="button" class="del" data-k="del">⌫ 清除</button><button type="button" data-n="0">0</button><button type="button" class="go" data-k="go">確定</button>
        </div>
      </div>
    </section>

    <section data-screen="result" hidden><div id="result" class="card result"></div></section>
  </main>
</div>

<div id="clearCover" class="cover" hidden><div class="card">
  <div class="big">清除練習紀錄？</div>
  <p>這台裝置上「認識乘法」的紀錄會清除，清除後不能復原。（乘法小練習的燈號不會被清除）</p>
  <div class="row" style="justify-content:center"><button class="btn" type="button" id="clearYes">清除紀錄</button><button class="btn primary" type="button" id="clearNo">取消</button></div>
</div></div>

<script>
/* =====================================================================
   參數區（改數字、改字不用動下面的程式）
   乘法的寫法：被乘數（1 份有幾個）寫在前面，乘數（有幾份）寫在後面。
   例：1 盤有 4 個，有 3 盤 → 4×3（和 mul.html「7×6 是 7的乘法」一致）
   ===================================================================== */
const VERSION = {id:'mulpic21', name:'家長版 v2.1'};
const ROUND_OPTS = [5, 10];           /* 孩子可選的每局題數 */
const ROUND_N = 10;                   /* 每局題數（預設） */
const A_MIN = 2, A_MAX = 9;           /* 1 份有幾個（被乘數） */
const B_MIN = 2, B_MAX = 5;           /* 有幾份（乘數）：看圖、文字題、連加；認識乘法階段先用小的數 */
const ROW_MAX = 5;                    /* 圖：一個框裡一排最多放幾個，方便數 */
const STORE_KEY = 'mulpic1';          /* 瀏覽器儲存的鍵名（和乘法小練習 mulfact1 分開） */

/* 題型（依課本「認識乘法」練習園地） */
const TYPES = [
  {id:'pic',  ic:'🍎', name:'看圖列式',         d:'看圖說一說，再列式、寫答案和單位'},
  {id:'word', ic:'📝', name:'文字題',           d:'讀題目，列式、寫答案和單位'},
  {id:'add',  ic:'➕', name:'連加和倍',         d:'5＋5＋5 改寫成乘法，是 5 的幾倍'},
  {id:'term', ic:'🔤', name:'被乘數・乘數・積', d:'認識算式裡每個數的名稱'},
];

/* 看圖：c＝一份的單位、n＝東西、u＝答案的單位 */
const PIC_THINGS = [
  {c:'盤', n:'蘋果', u:'個', e:'🍎', cls:'u-plate'},
  {c:'袋', n:'糖果', u:'個', e:'🍬', cls:'u-bag'},
  {c:'盒', n:'餅乾', u:'片', e:'🍪', cls:'u-box'},
  {c:'籃', n:'橘子', u:'個', e:'🍊', cls:'u-basket'},
  {c:'碗', n:'草莓', u:'顆', e:'🍓', cls:'u-bowl'},
];
/* 文字題：c＝一份的單位、cn＝一份的名稱、n＝問的東西、u＝答案的單位、v＝動作 */
const WORD_CTX = [
  {e:'🍬', c:'包', cn:'糖果',   n:'糖果',   u:'個', v:'拿了'},
  {e:'🍪', c:'盒', cn:'餅乾',   n:'餅乾',   u:'片', v:'買了'},
  {e:'🍯', c:'組', cn:'果醬',   n:'果醬',   u:'瓶', v:'買了'},
  {e:'🐟', c:'個', cn:'魚缸',   n:'魚',     u:'條', v:'有'},
  {e:'🍌', c:'串', cn:'香蕉',   n:'香蕉',   u:'根', v:'買了'},
  {e:'🌷', c:'束', cn:'花',     n:'花',     u:'朵', v:'買了'},
  {e:'🖍️', c:'盒', cn:'彩色筆', n:'彩色筆', u:'枝', v:'買了'},
  {e:'🍊', c:'籃', cn:'橘子',   n:'橘子',   u:'個', v:'買了'},
];
const PEOPLE = ['弟弟','妹妹','哥哥','姊姊','媽媽','爸爸','老師'];

/* ---------- 注音 ----------

   後面是一、二、三聲 → ㄧˋ，例：一朵、一包、一組；後面沒有字（句尾、標點、數字）→ ㄧ。
   輕聲寫在最前面（˙ㄉㄜ）。要改讀音，直接改這兩張表。 */

/* ---------- 注音 ---------- */
const MISSING = new Set();
const isHan = ch => /[㐀-鿿]/.test(ch);
function zyCol(py){
  let light = false, tone = '';
  if (py[0]==='˙'){ light = true; py = py.slice(1); }
  const last = py[py.length-1];
  if ('ˊˇˋ'.includes(last)){ tone = last; py = py.slice(0,-1); }
  return `<span class="zr"><span class="zs">${light ? '<span class="zl">˙</span>' : ''}${[...py].map(c => `<span>${c}</span>`).join('')}</span>${tone ? `<span class="zt">${tone}</span>` : ''}</span>`;
}
function yiTone(next){
  if (!next || !next.py) return 'ㄧ';
  const p = next.py, t = p[p.length-1];
  return t==='ˋ' || p[0]==='˙' ? 'ㄧˊ' : 'ㄧˋ';
}
function zy(str){
  str = String(str);
  if (!P.pref.zy) return esc(str);
  const ch = [...str], seq = [];          /* 先查出每個字的讀音，再處理「一」的變調 */
  for (let i=0;i<ch.length;){
    let hit = null;
    for (let L=3;L>=2 && !hit;L--){ const w = ch.slice(i,i+L).join(''); if (w.length===L && WORDS[w]) hit = [w, WORDS[w].split(' ')]; }
    if (hit){ [...hit[0]].forEach((c,k) => seq.push({c, py:hit[1][k]})); i += [...hit[0]].length; continue; }
    const c = ch[i];
    if (isHan(c) && !ZY[c]) MISSING.add(c);
    seq.push({c, py: isHan(c) ? ZY[c] || null : null});
    i++;
  }
  seq.forEach((x,i) => { if (x.c==='一') x.py = yiTone(seq[i+1]); });
  return seq.map(x => x.py ? `<span class="zc">${x.c}${zyCol(x.py)}</span>` : esc(x.c)).join('');
}
/* 文字裡的數字用 {數字}，會換成醒目的數字 */
const T = s => String(s).split(/(\{[^}]*\})/).map(p => p[0]==='{' ? `<span class="n">${esc(p.slice(1,-1))}</span>` : zy(p)).join('');

/* ---------- 聲音 ---------- */
const Sound = {
  ac:null, muted:false,
  init(){ if (!this.ac){ try{ this.ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if (this.ac && this.ac.state==='suspended') this.ac.resume(); },
  tone(f,d,type,when,vol){
    const ac = this.ac; if (!ac || this.muted) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime+(when||0);
    o.type = type||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol||.14,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.03);
  },
  tap(){ this.tone(520,.05,'sine',0,.06); },
  good(){ this.tone(660,.12,'triangle'); this.tone(990,.2,'triangle',.08); },
  star(){ [784,988,1319].forEach((f,i)=>this.tone(f,.16,'triangle',i*.07)); },
  soft(){ this.tone(330,.22,'sine',0,.09); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',i*.11)); }
};
Sound.muted = !P.pref.sound;
document.addEventListener('pointerdown', () => Sound.init(), {passive:true});

function picHTML(a, b, th){
  const cols = a <= ROW_MAX ? a : Math.ceil(a/2);
  const e = b > 6 ? 'clamp(16px,3.3vmin,28px)' : a > 6 || b > 4 ? 'clamp(20px,4.2vmin,34px)' : 'clamp(24px,5.4vmin,44px)';
  let h = '';
  for (let k=0;k<b;k++){
    h += `<div class="box ${th.cls}" data-box="${k}" style="grid-template-columns:repeat(${cols},auto);--e:${e}">`;
    for (let i=0;i<a;i++) h += `<span class="it">${th.e}</span>`;
    h += '</div>';
  }
  return `<div class="pic" id="gPic">${h}</div>`;
}
function markItems(){ const bx = document.querySelector('#gPic .box'); if (!bx) return; bx.classList.add('hl'); bx.querySelectorAll('.it').forEach((it,i) => { if (!it.querySelector('.no')) it.insertAdjacentHTML('beforeend', `<span class="no">${i+1}</span>`); }); }

function markAddends(){ document.querySelectorAll('#gPrompt .ad').forEach((s,i) => { if (!s.querySelector('.no')) s.insertAdjacentHTML('beforeend', `<span class="no">${i+1}</span>`); }); }

/* =====================================================================
   出題：每一題＝題目（圖或文字）＋幾行填空，一行一行做
   行裡的東西：字串（會加注音；{5} 是數字）、{k:'n'} 數字格、{k:'u'} 單位按鈕、{k:'show'} 直接顯示的數
   ===================================================================== */
const NUM = (want, max) => ({k:'n', want, max});
const UNIT = (want, opts) => ({k:'u', want, opts});
const SHOW = v => ({k:'show', v});
const X = {k:'x'};
const unitOpts = (u, c) => shuffle([u, c]);
const addExpr = (a, b) => Array(b).fill(a).join('＋');
const revealTxt = (q, k) => q.keys[k].k==='u' ? `「${q.keys[k].want}」` : String(q.keys[k].want);

function makePic(a, b){
  const th = pickOne(PIC_THINGS), kind = Math.random() < .5 ? 'A' : 'B', ab = a*b;
  const front = kind==='A' ? `1 ${th.c}有幾${th.u}` : `幾${th.u}一數`, back = kind==='A' ? `有幾${th.c}` : '數了幾次';
  const sent = kind==='A'
    ? [`1 ${th.c}有`, NUM(a,1), `${th.u}，有`, NUM(b,1), th.c]
    : [NUM(a,1), `${th.u}一數，數了`, NUM(b,1), '次'];
  return {type:'pic', a, b, label:`${a}×${b}＝${ab}`,
    prompt: picHTML(a, b, th) + `<div class="ask">${T(`一共有幾${th.u}${th.n}？`)}</div>`,
    lines: [
      {toks: sent, hint(bad){
        const tips = [];
        if (bad.includes(0)){ markItems(); tips.push(kind==='A' ? `請你數一下，1 ${th.c}裡有幾${th.u}？` : `幾${th.u}一數？請你數一下 1 ${th.c}裡有幾${th.u}`); }
        if (bad.includes(1)){ markBoxes(); tips.push(kind==='A' ? `請你數一下，一共有幾${th.c}？` : `1 ${th.c}數一次，數了幾次？`); }
        return tips.join('　');
      }},
      formulaLine(a, b, front, back),
      answerLine(ab, th.u, th.c, th.n),
    ],
    sum: `{${a}} ${th.u}一數，數了 {${b}} 次，就是 {${a}} 的 {${b}} 倍，寫成 {${a}×${b}＝${ab}}`};
}
function makeWord(a, b){
  const c = pickOne(WORD_CTX), who = pickOne(PEOPLE), ab = a*b, kind = Math.random() < .5 ? 1 : 2;
  const extra = c.cn===c.n ? '' : c.n;          /* 魚缸裡的「魚」 */
  const text = kind===1
    ? `一${c.c}${c.cn}有 {${a}} ${c.u}${extra}，${who}${c.v} {${b}} ${c.c}${extra ? c.cn : ''}，共有幾${c.u}${c.n}？`
    : `${who}有 {${b}} ${c.c}${c.cn}，每${c.c}${c.cn}有 {${a}} ${c.u}${extra}，${who}共有幾${c.u}${c.n}？`;
  return {type:'word', a, b, label:`${a}×${b}＝${ab}`,
    prompt: `<div class="story"><span class="em">${c.e}</span><div class="ask">${T(text)}</div></div>`,
    lines: [ formulaLine(a, b, `每${c.c}有幾${c.u}`, `有幾${c.c}`), answerLine(ab, c.u, c.c, c.n) ],
    sum: `每${c.c}有 {${a}} ${c.u}，有 {${b}} ${c.c}，就是 {${a}} 的 {${b}} 倍，寫成 {${a}×${b}＝${ab}}，答：{${ab}} ${c.u}`};
}
function makeAdd(a, b){
  const ab = a*b;
  return {type:'add', a, b, label:`${addExpr(a,b)}＝${ab}`,
    prompt: `<div class="bigeq">${Array(b).fill(`<span class="ad">${a}</span>`).join('<span>＋</span>')}<span>＝${ab}</span></div>`,
    lines: [
      {toks:['一共有', NUM(b,1), `個 {${a}} 相加`], hint(){ markAddends(); return `請你數一下，有幾個 {${a}}？`; }},
      {toks:[`是 {${a}} 的`, NUM(b,1), '倍'], hint(){ return `有幾個 {${a}} 相加，就是 {${a}} 的幾倍`; }},
      {toks:['用乘法算式記作：', NUM(a,1), X, NUM(b,1), '＝', NUM(ab,2)], terms:true, hint(bad, q, vals){
        const ks = q.lineKeys[2];
        if (+vals[ks[0]]===b && +vals[ks[1]]===a && a!==b) return `前後放反了！× 前面寫 {${a}}，× 後面寫有幾個 {${a}}`;
        if (bad.includes(ks[2]) && bad.length===1) return `${addExpr(a,b)}＝{${ab}}`;
        return `× 前面寫 {${a}}，× 後面寫有幾個 {${a}}`;
      }},
    ],
    sum: `{${b}} 個 {${a}} 相加，就是 {${a}} 的 {${b}} 倍，寫成 {${a}×${b}＝${ab}}`};
}
function makeTerm(a, b){
  const ab = a*b;
  if (b >= 3 && Math.random() < .4){
    /* 4×6 比 4×5 多了幾個 4，是多幾 */
    return {type:'term', a, b, label:`${a}×${b} 比 ${a}×${b-1}`,
      prompt: `<div class="bigeq"><span>${a}×${b}</span><span style="font-size:.6em;align-self:center">${zy('比')}</span><span>${a}×${b-1}</span></div>`,
      lines: [{toks:[`{${a}×${b}} 比 {${a}×${b-1}} 多了`, NUM(1,1), `個 {${a}}，是多`, NUM(a,1)], hint(){
        return `{${a}×${b}} 是 {${b}} 個 {${a}}，{${a}×${b-1}} 是 {${b-1}} 個 {${a}}`; }}],
      sum: `{${a}×${b}} 比 {${a}×${b-1}} 多了 {1} 個 {${a}}，是多 {${a}}`};
  }
  return {type:'term', a, b, label:`${a}×${b}＝${ab}`,
    prompt: `<div class="bigeq"><span class="tA">${a}</span><span>×</span><span class="tB">${b}</span><span>＝</span><span class="tC">${ab}</span></div>`,
    lines: [{toks:['被乘數是', NUM(a,1), '，乘數是', NUM(b,1), '，積是', NUM(ab,2)], hint(){
      return '× 前面是被乘數，× 後面是乘數，＝ 後面是積'; }}],
    sum: `{${a}×${b}＝${ab}}：被乘數是 {${a}}，乘數是 {${b}}，積是 {${ab}}`};
}
function formulaLine(a, b, front, back){
  const ab = a*b;
  return {toks:['列式：', NUM(a,1), X, NUM(b,1), '＝', NUM(ab,2)], terms:true, hint(bad, q, vals){
    const ks = q.lineKeys[q.step];
    if (+vals[ks[0]]===b && +vals[ks[1]]===a && a!==b) return `前後放反了！× 前面寫「${front}」，× 後面寫「${back}」`;
    if (bad.includes(ks[0]) || bad.includes(ks[1])) return `再讀一次題目：× 前面寫「${front}」，× 後面寫「${back}」`;
    return `把 {${b}} 個 {${a}} 相加：${addExpr(a,b)}＝？`;
  }};
}
function answerLine(ab, u, c, n){
  return {toks:['答：', SHOW(ab), UNIT(u, unitOpts(u, c))], hint(bad, q){
    const k = q.lineKeys[q.step][0];
    return G.wrong[k] >= 2 ? `答案的單位是「${u}」` : `再讀一次題目：問的是「幾${u}${n}」`;
  }};
}
const MAKERS = {pic:makePic, word:makeWord, add:makeAdd, term:makeTerm};

function buildRound(type){
  const n = P.pref.n, list = [], seen = new Set();
  const types = type==='mix' ? shuffle(Array.from({length:n}, (_,i) => TYPES[i % TYPES.length].id)) : Array(n).fill(type);
  types.forEach(t => {
    let a, b, tries = 0, key;
    do {
      a = rnd(A_MIN, A_MAX);
      b = t==='term' ? rnd(2, 9) : rnd(B_MIN, t==='add' ? B_MAX+1 : B_MAX);
      key = t + a + 'x' + b; tries++;
    } while ((seen.has(key) || (list.length && list[list.length-1].a===a)) && tries < 30);
    seen.add(key);
    const q = MAKERS[t](a, b);
    /* 每一格編號 */
    q.keys = []; q.lineKeys = q.lines.map(L => L.toks.filter(x => x.k==='n' || x.k==='u').map(x => (q.keys.push(x), q.keys.length-1)));
    q.miss = false;
    list.push(q);
  });
  return list;
}
const TYPE_NAME = id => id==='mix' ? '綜合練習' : TYPES.find(t => t.id===id).name;
function startRound(type){
  G = {q:buildRound(type), i:0, type};
  show('game');
  $('#gMode').textContent = (type==='mix' ? '🎲 ' : TYPES.find(t => t.id===type).ic + ' ') + TYPE_NAME(type);
  nextQ();
}
function renderDots(){
  $('#gDots').innerHTML = G.q.map((e,i) => `<i class="${i<G.i ? (e.miss?'miss':'done') : i===G.i ? 'now' : ''}"></i>`).join('');
}
function nextQ(){
  if (!G) return;
  if (G.i >= G.q.length) return endRound();
  const q = G.cur = G.q[G.i];
  q.step = 0;
  const nk = q.keys.length;
  G.vals = Array(nk).fill(''); G.state = Array(nk).fill(''); G.wrong = Array(nk).fill(0); G.lock = false;
  G.focus = q.lineKeys[0][0];
  $('#gPrompt').innerHTML = q.prompt;
  $('#gMsg').textContent = ''; $('#gMsg').className = 'msg'; $('#gSum').hidden = true;
  $('#gCard').scrollTop = 0;
  renderLines(); renderDots(); updGo();
}
function lineHTML(q, li){
  const L = q.lines[li], active = li===q.step && !G.lock, done = li < q.step || (G.lock && li===q.step);
  let h = '', nth = 0;
  L.toks.forEach(t => {
    if (typeof t==='string'){ h += `<span>${T(t)}</span>`; return; }
    if (t.k==='x'){ h += '<span class="x">×</span>'; return; }
    if (t.k==='show'){ h += `<span class="shown">${li <= q.step ? t.v : '？'}</span>`; return; }
    const k = q.lineKeys[li][nth++], st = G.state[k], can = active && st!=='ok';
    if (t.k==='u'){
      h += `<span class="units">${t.opts.map(u => {
        const on = G.vals[k]===u, cls = on ? (st || 'on') : '';
        return `<button type="button" class="ub ${cls}" data-u="${k}" data-v="${u}" ${can?'':'disabled'}>${zy(u)}</button>`;
      }).join('')}</span>`;
      return;
    }
    const v = G.vals[k] ? G.vals[k] : (can && G.focus===k ? '<span class="cur"></span>' : '');
    const cls = st || (can && G.focus===k ? 'focus' : '');
    const btn = `<button type="button" class="bl ${cls}" data-bl="${k}" ${can?'':'disabled'}>${v}</button>`;
    /* 列式答對後，下面標出被乘數、乘數、積 */
    if (L.terms && done){ const nm = [['被乘數','tA'],['乘數','tB'],['積','tC']][nth-1]; h += `<span class="slot">${btn}<span class="term ${nm[1]}">${zy(nm[0])}</span></span>`; }
    else h += btn;
  });
  return `<div class="line ${li > q.step ? 'wait' : ''}">${h}</div>`;
}
function renderLines(){
  const q = G.cur;
  $('#gLines').innerHTML = q.lines.map((_,li) => li <= q.step + 1 ? lineHTML(q, li) : '').join('');
}
$('#gLines').addEventListener('click', e => {
  if (!G || G.lock) return;
  const u = e.target.closest('[data-u]');
  if (u && !u.disabled){ const k = +u.dataset.u; G.vals[k] = u.dataset.v; if (G.state[k]==='no') G.state[k] = ''; G.focus = k; Sound.tap(); renderLines(); updGo(); return; }
  const b = e.target.closest('[data-bl]'); if (!b || b.disabled) return;
  G.focus = +b.dataset.bl; Sound.tap(); renderLines();
});
const stepKeys = () => G.cur.lineKeys[G.cur.step];
function updGo(){ document.querySelector('.pad .go').disabled = !G || G.lock || !stepKeys().every(k => G.vals[k] || G.state[k]==='ok'); }
function press(k){
  if (!G || G.lock || screen!=='game') return;
  Sound.tap();
  const q = G.cur, keys = stepKeys();
  if (k==='go') return submit();
  const f = G.focus, tok = q.keys[f];
  if (k==='del'){
    if (tok && tok.k==='n' && G.vals[f] && G.state[f]!=='ok') G.vals[f] = '';
    else { const prev = keys.filter(x => x < f && G.state[x]!=='ok' && q.keys[x].k==='n').pop(); if (prev!=null){ G.focus = prev; G.vals[prev] = ''; } }
  } else {
    if (!tok || tok.k!=='n' || G.state[f]==='ok') return;
    /* 兩位數的格子（積）：可以連按兩個數字；一位數的格子按了就跳到下一格 */
    let v = G.vals[f];
    v = (tok.max > 1 && v.length===1 && G.state[f]!=='no') ? v + k : k;
    if (v==='0') return;
    G.vals[f] = v; if (G.state[f]==='no') G.state[f] = '';
    if (v.length >= tok.max){
      const next = keys.find(x => x > f && G.state[x]!=='ok' && !G.vals[x] && q.keys[x].k==='n');
      if (next!=null) G.focus = next;
    }
  }
  renderLines(); updGo();
}
$('#pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  press(b.dataset.n!=null ? b.dataset.n : b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (screen!=='game') return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key==='Backspace'){ e.preventDefault(); press('del'); }
  else if (e.key==='Enter'){ e.preventDefault(); press('go'); }
});

function submit(){
  const q = G.cur, keys = stepKeys();
  if (!keys.every(k => G.vals[k])) return;
  const ok = k => q.keys[k].k==='u' ? G.vals[k]===q.keys[k].want : +G.vals[k]===q.keys[k].want;
  const bad = keys.filter(k => !ok(k));
  keys.forEach(k => { G.state[k] = bad.includes(k) ? 'no' : 'ok'; });
  if (!bad.length) return stepDone();

  q.miss = true; Sound.soft();
  bad.forEach(k => G.wrong[k]++);
  const vals = G.vals.slice();
  let tip = q.lines[q.step].hint(bad, q, vals) || '';
  const reveal = bad.filter(k => G.wrong[k] >= 2 && q.keys[k].k==='n');
  if (reveal.length) tip += `（正確答案是 {${reveal.map(k => revealTxt(q,k)).join('、')}}，請輸入）`;
  const m = $('#gMsg'); m.className = 'msg bad'; m.innerHTML = T(tip);
  /* 錯的數字格清空，游標放到第一個錯的格子；單位按鈕保留紅色 */
  bad.forEach(k => { if (q.keys[k].k==='n') G.vals[k] = ''; });
  G.focus = bad[0];
  renderLines(); updGo();
}
function stepDone(){
  const q = G.cur, m = $('#gMsg');
  if (q.step < q.lines.length - 1){
    Sound.good();
    q.step++; G.focus = q.lineKeys[q.step][0];
    m.className = 'msg good'; m.innerHTML = T('答對了！再往下寫');
    document.querySelectorAll('#gPic .box').forEach(bx => bx.classList.remove('hl'));
    renderLines(); updGo(); return;
  }
  G.lock = true;
  renderLines(); updGo();
  P.done++; if (!q.miss) P.clean++; save();
  m.className = 'msg good'; m.innerHTML = T(q.miss ? '答對了！' : '一次就答對，太棒了！');
  $('#gSum').innerHTML = T(q.sum); $('#gSum').hidden = false;
  q.miss ? Sound.good() : Sound.star();
  const g = G;
  setTimeout(() => { if (G===g){ G.i++; nextQ(); } }, q.miss ? 3000 : 2400);
}

/* ---------- 結算：只和自己比 ---------- */
function endRound(){
  const g = G; G = null;
  P.rounds++; save();
  Sound.win();
  const clean = g.q.filter(q => !q.miss).length;
  const chip = q => `<span class="qchip ${q.miss?'miss':''}">${esc(q.label)}</span>`;
  const miss = g.q.filter(q => q.miss);
  show('result');
  $('#result').innerHTML = `
    <div class="r-top"><h2>🎉 練習完成！</h2><span class="chipm">${esc(TYPE_NAME(g.type))}</span></div>
    <div class="r-stats"><div>一次就答對<b>${clean}</b> / ${g.q.length} 題</div><div>累計練了<b>${P.done}</b> 題</div></div>
    <div class="r-row"><b>這一局的題目：</b>${g.q.map(chip).join('')}</div>
    ${miss.length ? `<div class="r-row"><b>🔍 要再想一想的：</b>${miss.map(chip).join('')}</div>` : '<div class="r-row"><b>每一題都一次就答對，太厲害了！</b></div>'}
    <p class="dim">記得：× 前面寫「1 份有幾個」（被乘數），× 後面寫「有幾份」（乘數）；答案的單位，看題目問的是「幾個什麼」。</p>
    <div class="row">
      <button class="btn primary" type="button" id="rAgain">再練一局</button>
      <button class="btn" type="button" id="rHome">換題型</button>
      <a class="btn" href="mul.html">去乘法小練習點燈</a>
    </div>`;
  $('#rAgain').onclick = () => startRound(g.type);
  $('#rHome').onclick = () => show('home');
}

/* ---------- 小提示 ---------- */
function toast(text, ms){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms||2000);
}

/* ---------- 清除紀錄：連點標題 5 下（只在首頁）＋按兩次確認 ---------- */
let tClicks = 0, tTimer = 0;
$('#title').addEventListener('click', () => {
  tClicks++; clearTimeout(tTimer); tTimer = setTimeout(() => tClicks = 0, 2000);
  if (tClicks >= 5 && screen==='home'){ tClicks = 0; $('#clearCover').hidden = false; }
});
$('#clearNo').addEventListener('click', () => { const y = $('#clearYes'); delete y.dataset.arm; y.textContent = '清除紀錄'; $('#clearCover').hidden = true; });
$('#clearYes').addEventListener('click', () => {
  const y = $('#clearYes');
  if (!y.dataset.arm){ y.dataset.arm = '1'; y.textContent = '再按一次：確定清除'; setTimeout(() => { delete y.dataset.arm; y.textContent = '清除紀錄'; }, 3000); return; }
  delete y.dataset.arm; y.textContent = '清除紀錄';
  loadP({pref:P.pref}); save();
  $('#clearCover').hidden = true; toast('練習紀錄已清除'); show('home');
});

show('home');
</script>
